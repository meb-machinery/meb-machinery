  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
  body{padding:0 16px calc(150px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
  .logo{height:44px;width:auto;display:block;mix-blend-mode:lighten}
  .hdr-r{text-align:right}
  .fecha{font-weight:700;font-size:15px}
  .estado{font-size:12px;color:var(--mut)}
  .btn-ref{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:4px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600}
  .tab.on{background:var(--y);color:#111;border-color:var(--y)}
  .tab small{opacity:.8;font-weight:500}
  h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);margin:20px 0 8px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .card.hecha{opacity:.55}
  .card.pros{border-left:4px solid var(--blue)}
  .card.alta{border-left-color:var(--y)}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .hora{font-weight:800;font-size:18px;color:var(--y);white-space:nowrap}
  .tit{font-weight:700;font-size:16px}
  .sub{color:var(--mut);font-size:13px;margin-top:2px}
  .nota{font-size:13px;margin-top:8px;background:var(--card2);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--mut)}
  .chip.y{color:var(--y);border-color:rgba(244,180,0,.5)}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .a{flex:1 1 auto;min-width:0;text-align:center;text-decoration:none;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:14px;font-weight:600}
  .a.p{background:var(--y);color:#111;border-color:var(--y)}
  .a.ok{background:rgba(46,204,113,.15);border-color:var(--ok);color:var(--ok)}
  button.a{font-family:inherit}
  .vacio{color:var(--mut);text-align:center;padding:26px 8px;font-size:14px}
  .ruta{display:block;width:100%;background:var(--y);color:#111;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:800;margin:6px 0 4px;text-align:center;text-decoration:none}
  .ruta.off{background:var(--card2);color:var(--mut);pointer-events:none}
  .ayuda{font-size:12px;color:var(--mut);margin:2px 2px 10px}
  .zonas{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .zonas::-webkit-scrollbar{display:none}
  .z{flex:0 0 auto;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px}
  .z.on{color:#111;background:var(--y);border-color:var(--y);font-weight:700}
  label.sum{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
  label.sum input{width:20px;height:20px;accent-color:#F4B400}
  .fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));background:var(--y);color:#111;border:0;border-radius:999px;padding:15px 20px;font-size:16px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:8}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
  .sheet-bg.on{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .f{margin-bottom:12px}
  .f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
  .f input,.f select,.f textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
  .of{display:flex;flex-wrap:wrap;gap:10px;font-size:14px}
  .of label{display:flex;align-items:center;gap:6px;color:var(--tx);font-size:14px;margin:0}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:#111;border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90vw}
  .msg-grande{text-align:center;padding:60px 12px;color:var(--mut)}
  .msg-grande b{color:var(--tx);display:block;font-size:18px;margin-bottom:8px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;max-width:640px;margin:0 auto;background:#101010;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 4px 8px;font-size:20px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
  .nav button span{font-size:12px;font-weight:700}
  .nav button.on{color:var(--y)}
  #vGastos iframe{display:block;width:100%;height:calc(100vh - 150px);height:calc(100dvh - 150px);min-height:420px;border:0;border-radius:12px;background:#111}
  .url{font-size:12px;color:var(--blue);word-break:break-all;margin-top:6px}
  .sug{font-size:13px;background:var(--card2);border-radius:8px;padding:9px 10px;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  .paso{display:flex;gap:10px;margin:8px 0;font-size:14px}
  .paso b{flex:0 0 24px;height:24px;border-radius:50%;background:var(--y);color:#111;text-align:center;line-height:24px;font-size:13px}
  .web-card{border-left:4px solid var(--ok)}
  .inst{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mut);margin-top:10px;display:none}
</style>
</head>

const TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
const LS_DATA = 'meb_midia_data', LS_Q = 'meb_midia_cola';

const OFERTAS = { maquinaria:'🔧 Reparación', herramientas:'🧰 Cajas de herramientas', repuestos:'🔩 Repuestos', herreria:'⚒️ Herrería' };

  ['interesado','Interesado'],
  ['pidio_presupuesto','Pidió presupuesto'],

let D = { hoy:'', visitas:[], prospectos:[], web:{}, links:{} };
let vista = 'dia';
let diaSel = '';
let zonaFiltro = '';
let enRuta = {};            // prospectoId -> true

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display='none',2600); }
function soloDigitos(t){ return String(t||'').replace(/\D/g,''); }
function telWA(t){ let d=soloDigitos(t); if(!d) return ''; if(d.startsWith('00')) d=d.slice(2); if(d.startsWith('54')) return d.startsWith('549')?d:'549'+d.slice(2); if(d.startsWith('0')) d=d.slice(1); d=d.replace(/^(\d{2,4})15/,'$1'); return '549'+d; }
function fechaLarga(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return dt.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}); }
function fechaCorta(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return dt.toLocaleDateString('es-AR',{weekday:'short',day:'numeric'}).replace('.',''); }
function sumarDias(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d+n); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function hoyLocal(){ const dt=new Date(); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function mapsBuscar(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); }

/* ---------- red: lectura, envíos y cola sin conexión ---------- */
function cargar(manual){
  if(!TOKEN){ mostrarSinAcceso(); return; }
  if(manual || (!D.visitas.length && !D.prospectos.length)) document.getElementById('estado').textContent = 'Actualizando…';
  _ultimoPedido = Date.now();
  fetch(SCRIPT_URL+'?action=miDia&t='+encodeURIComponent(TOKEN))
    .then(r=>r.json())
    .then(j=>{
      if(!j.ok){ if(!D.visitas.length && !D.prospectos.length) mostrarSinAcceso(); else toast('No se pudo actualizar'); return; }
      D = { hoy:j.hoy, visitas:j.visitas||[], prospectos:j.prospectos||[], web:j.web||{}, links:j.links||{} };
      sinConexion = false;
      ultimaCarga = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
      ls(LS_DATA, JSON.stringify({ d:D, t:ultimaCarga, dia:hoyLocal() }));
      aplicarColaLocal();
      render();
      if(manual) toast('Actualizado');
    })
    .catch(()=>{
      sinConexion = true;
      const g = ls(LS_DATA);
      if(g){ try{ const o=JSON.parse(g); D=o.d; ultimaCarga=o.t+' (guardado)'; aplicarColaLocal(); render(); }catch(e){} }
      else document.getElementById('app').innerHTML='<div class="msg-grande"><b>Sin conexión</b>Abrila de nuevo cuando tengas señal.</div>';
      document.getElementById('estado').textContent='Sin conexión';
    });
}
function leerCola(){ try{ return JSON.parse(ls(LS_Q)||'[]'); }catch(e){ return []; } }
function enviar(payload){
  const cola = leerCola(); cola.push(payload); ls(LS_Q, JSON.stringify(cola));
  vaciarCola();
}
function vaciarCola(){
  const cola = leerCola();
  if(!cola.length) return;
  const p = cola[0];
  fetch(SCRIPT_URL,{ method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(p) })
    .then(()=>{ const c=leerCola(); c.shift(); ls(LS_Q, JSON.stringify(c)); if(c.length) vaciarCola(); else if(!sinConexion) setTimeout(()=>cargar(false),1500); })
    .catch(()=>{ /* queda en la cola; se reintenta al volver la señal */ });
}
// Los cambios que todavía no se enviaron se reflejan igual en pantalla.
function aplicarColaLocal(){
  leerCola().forEach(p=>{
    const r=p.row||{};
    if(p.action==='miDiaRegistrar'){
      if(r.tipo==='prospecto'){ const x=D.prospectos.find(z=>z.id===r.id); if(x) aplicarResultado(x,r.resultado); }
      if(r.tipo==='visita' && !r.volver){ const v=D.visitas.find(z=>z.id===r.id); if(v) v.estado='realizada'; }
    }
  });
}
function aplicarResultado(p, resultado){
  p.resultado=resultado;
  if(resultado==='volver_a_visitar'||resultado==='no_estaba'){ p.visitado=false; p.estado='a_visitar'; }
  else { p.visitado=true; p.estado=(resultado==='ya_tiene_proveedor'||resultado==='no_interesado')?'perdido':'en_negociacion'; }
}

/* ---------- lógica del día ---------- */
function diasDisponibles(){
  const hoy = D.hoy || hoyLocal();
  const set = new Set([hoy, sumarDias(hoy,1)]);
  D.visitas.forEach(v=>set.add(v.fecha));
  return [...set].sort();
}
function visitasDelDia(f){ return D.visitas.filter(v=>v.fecha===f); }
function prospDeVisita(v){ return v.prospectoId ? D.prospectos.find(p=>p.id===v.prospectoId) : null; }
function direccionVisita(v){
  const p = prospDeVisita(v);
  if(p && (p.direccion||p.zona)) return [p.direccion,p.zona].filter(Boolean).join(', ');
  // si la visita tiene una dirección en las notas ("Dirección · contacto · tel") se usa; si no, cliente + zona
  const n = String(v.notas||'').split('·')[0].trim();
  if(n && /\d/.test(n) && n.length>6) return n;
  return [v.cliente||v.titulo, v.zona].filter(Boolean).join(', ');
}
function zonasDelDia(f){
  const z = new Set();
  visitasDelDia(f).forEach(v=>{
    const p = prospDeVisita(v);
    if(v.zona) z.add(v.zona);
    if(p && p.zona) z.add(p.zona);
  });
  return [...z];
}
function esLeadWeb(p){ return p.origen==='web' && !p.visitado && (p.estado==='nuevo'||p.estado==='a_visitar'); }
function candidatos(f){
  const idsEnVisitas = new Set(visitasDelDia(f).map(v=>v.prospectoId).filter(Boolean));
  return D.prospectos.filter(p=>!idsEnVisitas.has(p.id) && !esLeadWeb(p) && !p.visitado && (p.estado==='nuevo'||p.estado==='a_visitar'))
    .sort((a,b)=>(PRIO[a.prioridad]??1)-(PRIO[b.prioridad]??1) || a.nombre.localeCompare(b.nombre));
}
function coincideZona(p, zonas){
  const pz = norm(p.zona+' '+p.direccion);
  return zonas.some(z=>{ const n=norm(z); return n && (pz.includes(n) || (norm(p.zona) && n.includes(norm(p.zona)))); });
}

function render(){
  const app=document.getElementById('app');
  const hoy = D.hoy || hoyLocal();
  const dias = diasDisponibles();
  if(!diaSel || !dias.includes(diaSel)) diaSel = dias.includes(hoy)?hoy:dias[0];
  document.getElementById('fecha').textContent = fechaLarga(hoy);
  document.getElementById('estado').textContent = (sinConexion?'Sin conexión · ':'')+'Actualizado '+ultimaCarga;
  document.getElementById('fab').style.display = (vista==='dia')?'block':'none';

  const tabs = dias.map(f=>{
    const n = visitasDelDia(f).filter(v=>v.estado!=='realizada').length;
    const lab = f===hoy?'Hoy':(f===sumarDias(hoy,1)?'Mañana':fechaCorta(f));
    return `<button class="tab ${f===diaSel?'on':''}" data-dia="${f}" type="button">${lab}${n?` <small>· ${n}</small>`:''}</button>`;
  }).join('');

  const vs = visitasDelDia(diaSel);
  let html = `<div class="tabs">${tabs}</div>`;

  html += htmlWeb();

  html += `<h2>Visitas${diaSel===hoy?' de hoy':''}</h2>`;
  if(!vs.length) html += `<div class="card vacio">No hay visitas cargadas para este día.<br>Si tenés tiempo, mirá los prospectos de abajo.</div>`;
  vs.forEach(v=>{ html += tarjetaVisita(v); });

  // ruta
  const paradas = armarParadas(vs);
  const hayRuta = paradas.length>=1;
  html += `<a class="ruta ${hayRuta?'':'off'}" ${hayRuta?`href="${esc(urlRuta(paradas))}" target="_blank" rel="noopener"`:''}>🧭 Ruta del día (${paradas.length} ${paradas.length===1?'parada':'paradas'})</a>`;
  html += `<div class="ayuda">Abre Google Maps con las visitas en orden y los prospectos que marques con “Sumar a la ruta”. Máximo 10 paradas.</div>`;

  // prospectos cercanos
  const zonas = zonasDelDia(diaSel);
  const cand = candidatos(diaSel);
  const cerca = cand.filter(p=>coincideZona(p,zonas)).slice(0,6);
  html += `<h2>Si tenés tiempo, pasá por acá</h2>`;
  if(zonas.length) html += `<div class="ayuda">Zonas de tus visitas: ${zonas.map(esc).join(', ')}</div>`;
  if(!cerca.length){
    const yaEnVisitas = vs.filter(v=>v.prospectoId).length;
    const msg = yaEnVisitas
      ? `Los prospectos de esta zona ya están arriba, como paradas de tu día (${yaEnVisitas}).`
      : 'No hay prospectos cargados en las zonas de este día.';
    html += `<div class="card vacio">${msg}${cand.length?'<br>Podés buscar en otras zonas más abajo.':''}</div>`;
  }
  cerca.forEach(p=>{ html += tarjetaProspecto(p); });

  // otras zonas
  const idsCerca = new Set(cerca.map(p=>p.id));
  const resto = cand.filter(p=>!idsCerca.has(p.id));
  if(resto.length){
    const zs = [...new Set(resto.map(p=>p.zona||'Sin zona'))].sort((a,b)=>a.localeCompare(b));
    html += `<h2>Otras zonas (por si el camino pasa cerca)</h2>`;
    html += `<div class="zonas">${zs.map(z=>`<button class="z ${z===zonaFiltro?'on':''}" data-zona="${esc(z)}" type="button">${esc(z)}</button>`).join('')}</div>`;
    const lista = zonaFiltro ? resto.filter(p=>(p.zona||'Sin zona')===zonaFiltro) : [];
    if(!zonaFiltro) html += `<div class="ayuda">Tocá una zona para ver sus prospectos.</div>`;
    lista.forEach(p=>{ html += tarjetaProspecto(p); });
  }
  html += `<div class="inst" id="inst"></div>`;
  app.innerHTML = html;
  prepararInstalacion();
}

/* ---------- consultas de la calculadora (máquina parada) ---------- */
function plata(n){ return '$'+Math.round(n||0).toLocaleString('es-AR'); }
function cuandoEvento(f,h){
  const hoy=D.hoy||hoyLocal();
  const dia = f===hoy?'hoy':(f===sumarDias(hoy,-1)?'ayer':fechaCorta(f));
  return dia+(h?' '+h:'');
}
function htmlWeb(){
  const w = D.web||{};
  const leads = D.prospectos.filter(esLeadWeb).sort((a,b)=>String(b.fechaAlta).localeCompare(String(a.fechaAlta)));
  const calcs = w.calculos||[];
  if(!leads.length && !calcs.length && !w.visitas7) return '';
  let h = `<h2>🧮 Máquinas paradas (calculadora)</h2>`;
  leads.forEach(p=>{
    h += `<div class="card web-card">
      <div class="row"><div><div class="tit">${esc(p.nombre)}</div><div class="sub">${esc(p.contacto||'')}${p.contacto&&p.zona?' · ':''}${esc(p.zona||'')}${p.fechaAlta?' · pidió presupuesto '+esc(cuandoEvento(p.fechaAlta,'')):''}</div></div>
      <span class="chip y">📞 Llamar hoy</span></div>
      ${p.marcaEquipos?`<div class="chips"><span class="chip">${esc(p.marcaEquipos)}</span></div>`:''}
      ${p.notas?`<div class="nota">${esc(p.notas)}</div>`:''}
      <div class="acts">
        ${p.telefono?`<a class="a p" href="tel:${esc(soloDigitos(p.telefono))}">📞 Llamar</a><a class="a" target="_blank" rel="noopener" href="https://wa.me/${esc(telWA(p.telefono))}">💬 WhatsApp</a>`:''}
        <button class="a ok" type="button" data-fui="p:${esc(p.id)}">✔ Ya lo contacté</button>
      </div></div>`;
  });
  if(w.visitas7||calcs.length){
    h += `<div class="card"><div class="sub" style="margin:0 0 6px"><b style="color:var(--tx)">Últimos 7 días:</b> entraron ${w.visitas7||0} · calcularon ${w.calculos7||0} · pidieron presupuesto ${w.leads7||0}</div>`;
    calcs.slice(0,5).forEach(c=>{
      h += `<div style="font-size:13px;padding:6px 0;border-top:1px solid var(--line)"><span style="color:var(--mut)">${esc(cuandoEvento(c.fecha,c.hora))}</span> · ${esc([c.tipo,c.marca].filter(Boolean).join(' '))||'Máquina'}${c.sintoma?' · '+esc(c.sintoma):''}${c.perdidaDia?' · pierde '+plata(c.perdidaDia)+'/día':''}${c.fuente?' <span style="color:var(--mut)">('+esc(c.fuente)+')</span>':''}</div>`;
    });
    if(calcs.length) h += `<div class="ayuda" style="margin-top:8px">Los que solo calculan no dejan nombre ni teléfono: sirve para saber que hay máquinas paradas en la zona. Los que piden presupuesto aparecen arriba para llamarlos.</div>`;
    h += `</div>`;
  }
  return h;
}

function armarParadas(vs){
  const out=[];
  vs.filter(v=>v.estado!=='realizada').forEach(v=>{ const d=direccionVisita(v); if(d) out.push(d); });
  Object.keys(enRuta).filter(id=>enRuta[id]).forEach(id=>{ const p=D.prospectos.find(x=>x.id===id); if(p){ const d=[p.direccion,p.zona].filter(Boolean).join(', '); if(d) out.push(d); } });
  return out.slice(0,10);
}
function urlRuta(paradas){
  const destino = paradas[paradas.length-1];
  const medio = paradas.slice(0,-1);
  let u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(destino);
  if(medio.length) u += '&waypoints='+encodeURIComponent(medio.join('|'));
  return u;
}

    <div class="f"><label>Resultado</label><select id="h-res"><option value="">Elegir…</option>${RESULTADOS.map(r=>`<option value="${r[0]}">${esc(r[1])}</option>`).join('')}</select></div>
    <div class="f"><label>Detalle (con quién hablaste, qué pidió…)</label><textarea id="h-notas" rows="3"></textarea>
      <div class="ayuda" style="margin-top:6px">Se guarda en el prospecto y, si tiene visita en el calendario, también en sus “Acuerdos / notas aparte”.</div></div>
    <div class="acts"><button class="a" type="button" id="h-cancel">Cancelar</button><button class="a p" type="button" id="h-ok">Guardar</button></div>`);
  document.getElementById('h-cancel').onclick=cerrarHoja;
  document.getElementById('h-ok').onclick=()=>{
    const res=document.getElementById('h-res').value;
    if(!res){ toast('Elegí qué resultó'); return; }
    const notas=document.getElementById('h-notas').value.trim();
    aplicarResultado(p,res);
    const v=D.visitas.find(x=>x.prospectoId===p.id); if(v && p.visitado) v.estado='realizada';
    delete enRuta[p.id];
    enviar({ action:'miDiaRegistrar', usuario:'Emmanuel (Mi día)', row:{ t:TOKEN, tipo:'prospecto', id:p.id, resultado:res, notas:notas } });
    cerrarHoja(); render(); toast('Visita registrada ✔');
  };
}

function hojaNuevo(){
  abrirHoja(`<h3>Nuevo prospecto</h3>
    <div class="f"><label>Empresa / obra / persona *</label><input id="n-nombre" placeholder="Ej: Obra Ruta 8 km 52"></div>
    <div class="f"><label>Dirección o ubicación</label><input id="n-dir" placeholder="Calle y número, o ruta y km"></div>
    <div class="f"><label>Zona</label><input id="n-zona" placeholder="Ej: Pilar, Escobar…" list="n-zonas"><datalist id="n-zonas">${[...new Set(D.prospectos.map(p=>p.zona).filter(Boolean))].map(z=>`<option value="${esc(z)}">`).join('')}</datalist></div>
    <div class="f"><label>Contacto</label><input id="n-cont" placeholder="Nombre / cargo"></div>
    <div class="f"><label>Teléfono</label><input id="n-tel" type="tel" inputmode="tel"></div>
    <div class="f"><label>Qué se le puede ofrecer</label><div class="of">${Object.keys(OFERTAS).map(k=>`<label><input type="checkbox" class="n-of" value="${k}"> ${esc(OFERTAS[k])}</label>`).join('')}</div></div>
    <div class="f"><label>Notas</label><textarea id="n-notas" rows="2" placeholder="Qué máquinas vi, con quién hablar…"></textarea></div>
    <label class="sum" style="margin:0 0 12px"><input type="checkbox" id="n-visit"> Ya lo visité ahora (registrar la visita)</label>
    <div class="f" id="n-resbox" style="display:none"><label>¿Qué resultó?</label><select id="n-res"><option value="">Elegir…</option>${RESULTADOS.map(r=>`<option value="${r[0]}">${esc(r[1])}</option>`).join('')}</select></div>
    <div class="acts"><button class="a" type="button" id="n-cancel">Cancelar</button><button class="a p" type="button" id="n-ok">Guardar</button></div>`);
  document.getElementById('n-cancel').onclick=cerrarHoja;
  document.getElementById('n-visit').onchange=function(){ document.getElementById('n-resbox').style.display=this.checked?'block':'none'; };
  document.getElementById('n-ok').onclick=()=>{
    const nombre=document.getElementById('n-nombre').value.trim();
    if(!nombre){ toast('Poné un nombre'); return; }
    const yaVisite=document.getElementById('n-visit').checked;
    const resultado=yaVisite?document.getElementById('n-res').value:'';
    if(yaVisite && !resultado){ toast('Elegí qué resultó'); return; }
    const row={ t:TOKEN, nombre:nombre, direccion:document.getElementById('n-dir').value.trim(), zona:document.getElementById('n-zona').value.trim(),
      contacto:document.getElementById('n-cont').value.trim(), telefono:document.getElementById('n-tel').value.trim(),
      tipoOferta:[...document.querySelectorAll('.n-of:checked')].map(c=>c.value).join(','), notas:document.getElementById('n-notas').value.trim(), resultado:resultado };
    const nuevo={ id:'tmp'+Date.now(), nombre:row.nombre, contacto:row.contacto, telefono:row.telefono, direccion:row.direccion, zona:row.zona,
      tipoOferta:row.tipoOferta, marcaEquipos:'', estado:'nuevo', visitado:false, fechaVisita:'', prioridad:'media', resultado:'', notas:row.notas };
    if(resultado) aplicarResultado(nuevo, resultado);
    D.prospectos.push(nuevo);
    enviar({ action:'miDiaNuevoProspecto', usuario:'Emmanuel (Mi día)', row:row });
    cerrarHoja(); render(); toast('Prospecto guardado ✔');
  };
}

/* ---------- instalación como app ---------- */
let promptInstalar=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); promptInstalar=e; prepararInstalacion(); });
function prepararInstalacion(){
  const el=document.getElementById('inst'); if(!el) return;
  if(window.matchMedia('(display-mode: standalone)').matches || ls('meb_midia_inst')==='1') return;
  el.style.display='block';
  el.innerHTML = promptInstalar
    ? '<b style="color:var(--tx)">Tenelo como app:</b> <button class="a p" id="btnInst" type="button" style="margin-left:8px;padding:6px 12px">Instalar</button>'
    : '<b style="color:var(--tx)">Tenelo como app:</b> en Chrome tocá ⋮ → “Agregar a la pantalla principal”.';
  const b=document.getElementById('btnInst');
  if(b) b.onclick=()=>{ promptInstalar.prompt(); promptInstalar.userChoice.finally(()=>{ ls('meb_midia_inst','1'); promptInstalar=null; render(); }); };
}
(function manifiesto(){
  try{
    const m={ name:'MEB · Emmanuel', short_name:'MEB Emma', display:'standalone', background_color:'#141414', theme_color:'#1A1A1A',
      start_url: location.href, icons:[{ src:ICON192, sizes:'192x192', type:'image/png', purpose:'any' }, { src:ICON512, sizes:'512x512', type:'image/png', purpose:'any' }, { src:ICON512, sizes:'512x512', type:'image/png', purpose:'maskable' }] };
    const l=document.createElement('link'); l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
})();

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-dia],[data-zona],[data-fui]'); if(!t) return;
  if(t.dataset.dia){ diaSel=t.dataset.dia; zonaFiltro=''; render(); }
  else if(t.dataset.zona){ zonaFiltro = (zonaFiltro===t.dataset.zona)?'':t.dataset.zona; render(); }
  else if(t.dataset.fui){ hojaFui(t.dataset.fui); }
});
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-v]'); if(n){ setVista(n.dataset.v); return; }
  const c=e.target.closest('[data-canal]'); if(c){ canal=c.dataset.canal; ls('meb_midia_canal',canal); renderCompartir(); return; }
  const a=e.target.closest('[data-ac]'); if(!a) return;
  const x=enlaces()[parseInt(a.dataset.i,10)]; if(!x) return;
  const texto=x.txt.replace('{link}',x.url);
  if(a.dataset.ac==='texto') copiarTexto(texto);
  else if(a.dataset.ac==='link') copiarTexto(x.url);
  else if(a.dataset.ac==='wa') window.open('https://wa.me/?text='+encodeURIComponent(texto),'_blank');
  else if(a.dataset.ac==='share'){ try{ navigator.share({text:texto}); }catch(err){} }
});
document.addEventListener('change',e=>{
  if(e.target.dataset && e.target.dataset.ruta){
    const id=e.target.dataset.ruta;
    const n=Object.keys(enRuta).filter(k=>enRuta[k]).length;
    if(e.target.checked && n>=8){ e.target.checked=false; toast('Máximo de paradas alcanzado'); return; }
    enRuta[id]=e.target.checked; render();
  }
});
document.getElementById('fab').onclick=hojaNuevo;
document.getElementById('btnRef').onclick=()=>cargar(true);
document.getElementById('sheetBg').addEventListener('click',e=>{ if(e.target.id==='sheetBg') cerrarHoja(); });
window.addEventListener('online',()=>{ sinConexion=false; vaciarCola(); cargar(false); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && TOKEN && Date.now()-_ultimoPedido>30000) cargar(false); });

/* ---------- arranque ---------- */
(function(){
  const g=ls(LS_DATA);
  if(g){ try{ const o=JSON.parse(g); if(o.dia===hoyLocal()){ D=o.d; ultimaCarga=o.t+' (guardado)'; aplicarColaLocal(); render(); } }catch(e){} }
  const h=(location.hash||'').replace('#','');
  if(h==='gastos'||h==='compartir') setVista(h);
  cargar(false);
  vaciarCola();
})();
</script>

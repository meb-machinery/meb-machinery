<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#1A1A1A; --yellow:#F4B400; --blue:#4E9BE0; --gray:#9B9990; --bone:#F5F2EC;
    --card:#242322; --card2:#2C2B29; --border:#3A3936; --green:#5CB85C; --red:#E05555;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Barlow',Arial,sans-serif;background:var(--black);color:var(--bone);}
  h1,h2,h3,.brand-font{font-family:'Bebas Neue',Arial,sans-serif;letter-spacing:.5px;}
  header{background:#111;color:var(--bone);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.5);border-bottom:2px solid var(--yellow);}
  header .brand{display:flex;align-items:center;gap:12px;}
  header .brand img{height:36px;width:36px;border-radius:7px;}
  header .brand .txt{font-family:'Bebas Neue',Arial,sans-serif;font-weight:400;font-size:24px;letter-spacing:1.5px;}
  header .brand .txt span{color:var(--yellow);}
  header .user{font-size:12px;color:var(--gray);}
  header button.logout{background:none;border:1px solid var(--gray);color:var(--bone);padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer;}
  header button.logout:hover{border-color:var(--yellow);color:var(--yellow);}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  @keyframes fillBar{from{width:0;}}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}

  #loginScreen{max-width:360px;margin:70px auto;background:var(--card);padding:36px 28px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.5);text-align:center;animation:fadeInUp .4s ease;border:1px solid var(--border);}
  #loginScreen img.logo{width:64px;height:64px;border-radius:14px;margin-bottom:14px;}
  #loginScreen p{color:var(--gray);font-size:13px;margin-bottom:22px;}
  #loginScreen input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:6px;border:2px solid var(--border);border-radius:6px;margin-bottom:16px;background:#1d1c1b;color:var(--bone);transition:border-color .2s;}
  #loginScreen input:focus{outline:none;border-color:var(--yellow);}
  #loginScreen button{width:100%;padding:14px;background:var(--yellow);border:none;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;color:#1a1a1a;transition:transform .15s;}
  #loginScreen button:hover{transform:translateY(-1px);}
  #loginError{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}
  #loginScreen .hint{font-size:11px;color:var(--gray);margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}
  .shake{animation:shake .3s;}

  main{max-width:820px;margin:0 auto;padding:26px 18px 80px;}

  .welcome{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:20px;animation:fadeInUp .4s ease;}
  .welcome h2{color:var(--yellow);margin:0 0 10px;font-size:26px;}
  .welcome p{font-size:14px;line-height:1.7;color:#cfcdc5;}
  .welcome .video-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden;margin:14px 0;background:#000;}
  .welcome .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

  .overview{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;animation:fadeInUp .4s ease;}
  .overview h2{color:var(--yellow);margin:0 0 4px;font-size:22px;}
  .overview .bar-track{background:#3a3936;border-radius:20px;height:10px;overflow:hidden;margin-top:10px;}
  .overview .bar-fill{background:linear-gradient(90deg,var(--yellow),#ffd257);height:100%;border-radius:20px;animation:fillBar 1s ease;}
  .overview .bar-label{font-size:12px;color:var(--gray);margin-top:6px;}

  .modules-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  .module-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;animation:fadeInUp .45s ease backwards;}
  .module-card:nth-child(1){animation-delay:.02s;} .module-card:nth-child(2){animation-delay:.08s;} .module-card:nth-child(3){animation-delay:.14s;}
  .module-card.locked{opacity:.5;cursor:not-allowed;}
  .module-card:not(.locked):hover{transform:translateY(-3px);border-color:var(--yellow);}
  .module-num{width:44px;height:44px;border-radius:50%;background:var(--yellow);color:#1a1a1a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;transition:background .3s;font-family:'Bebas Neue';}
  .module-card.locked .module-num{background:#4a4945;color:#8a8a86;}
  .module-card.done .module-num{background:var(--green);color:#fff;animation:popIn .4s ease;}
  .module-info h3{margin:0 0 4px;font-size:18px;color:var(--bone);}
  .module-info p{margin:0;font-size:13px;color:var(--gray);}
  .badge{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;padding:4px 10px;border-radius:20px;flex-shrink:0;}
  .badge.done{background:#1e3a1e;color:#8fd68f;}
  .badge.locked{background:#3a3936;color:#8a8a86;}
  .badge.available{background:#3a2f0d;color:var(--yellow);}

  .module-view{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:26px;animation:fadeInUp .35s ease;}
  .module-view h2{color:var(--yellow);border-bottom:3px solid var(--yellow);padding-bottom:8px;font-size:26px;}
  .module-view h3{color:var(--blue);margin-top:26px;font-size:19px;}
  .module-view ol,.module-view ul{padding-left:20px;line-height:1.7;color:#dcdad2;}
  .module-view p{color:#dcdad2;line-height:1.7;}
  .back-link{display:inline-block;margin-bottom:16px;color:var(--gray);text-decoration:none;font-size:13px;cursor:pointer;}
  .back-link:hover{color:var(--yellow);}

  .how-it-works{background:#1c2733;border:1px solid #2d4258;border-radius:8px;padding:14px 16px;margin-bottom:20px;font-size:13px;line-height:1.6;color:#cfe0f0;}
  .how-it-works strong{color:var(--blue);}

  .resources{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .resources a{background:#1d1c1b;border:1px solid var(--border);color:var(--bone);text-decoration:none;padding:9px 14px;border-radius:6px;font-size:12.5px;transition:border-color .15s;}
  .resources a:hover{border-color:var(--yellow);color:var(--yellow);}

  .media-block{margin:16px 0;}
  .media-block img,.media-block svg{width:100%;border-radius:8px;display:block;}
  .media-block .video-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden;background:#000;}
  .media-block .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .media-caption{font-size:12.5px;color:var(--gray);margin-top:6px;font-style:italic;}
  .media-placeholder{background:#2c2b29;border:2px dashed var(--border);border-radius:8px;padding:22px;text-align:center;color:var(--gray);font-size:13px;}
  .warn-box{background:#3a2f0d;border-left:4px solid var(--yellow);padding:14px 16px;margin:16px 0;font-weight:600;font-size:14px;border-radius:4px;color:#ffe9a8;}

  .mini-check{background:var(--card2);border:1px solid var(--border);padding:16px;border-radius:8px;margin:18px 0;}
  .mini-check p.q{font-weight:700;margin-bottom:10px;color:var(--bone);}
  .mini-check label{display:block;padding:9px 12px;background:#1d1c1b;border:1px solid var(--border);border-radius:6px;margin-bottom:7px;cursor:pointer;font-size:14px;color:#dcdad2;transition:border-color .15s;}
  .mini-check label:hover{border-color:var(--yellow);}
  .mini-check input{margin-right:8px;}
  .mini-check .feedback{font-size:13px;font-weight:700;margin-top:8px;min-height:18px;}
  .mini-check .feedback.ok{color:var(--green);}
  .mini-check .feedback.err{color:var(--red);}
  .mini-check button{margin-top:8px;background:var(--yellow);color:#1a1a1a;border:none;padding:9px 18px;border-radius:6px;font-size:12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .mini-check .next-btn{display:none;}

  .orden-ej{background:var(--card2);border:1px solid var(--border);padding:16px;border-radius:8px;margin:18px 0;}
  .orden-ej p.q{font-weight:700;margin-bottom:12px;color:var(--bone);}
  .orden-item{display:block;width:100%;text-align:left;padding:10px 14px;background:#1d1c1b;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer;font-size:13.5px;color:#dcdad2;position:relative;padding-left:40px;}
  .orden-item:hover:not(:disabled){border-color:var(--yellow);}
  .orden-item .num{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--yellow);color:#1a1a1a;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;font-family:'Bebas Neue';}
  .orden-item.selected .num{display:flex;}
  .orden-item.selected{opacity:.75;}
  .orden-item.correct{border-color:var(--green);background:#16241a;}
  .orden-item.incorrect{border-color:var(--red);background:#2a1717;}
  .orden-ej button{margin-top:6px;background:var(--yellow);color:#1a1a1a;border:none;padding:9px 18px;border-radius:6px;font-size:12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .orden-ej .feedback{font-size:13px;font-weight:700;margin-top:10px;min-height:18px;}
  .orden-ej .feedback.ok{color:var(--green);}
  .orden-ej .feedback.err{color:var(--red);}

  .quiz-q{background:var(--card2);padding:16px;border-radius:8px;margin-bottom:14px;border:1px solid var(--border);}
  .quiz-q p{font-weight:600;margin-bottom:8px;color:var(--bone);}
  .quiz-q label{display:block;padding:8px 10px;background:#1d1c1b;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:14px;color:#dcdad2;}
  .quiz-q label:hover{border-color:var(--yellow);}
  .quiz-q input{margin-right:8px;}

  button.primary{background:var(--yellow);border:none;padding:12px 24px;border-radius:6px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;font-size:13px;color:#1a1a1a;transition:transform .15s;}
  button.primary:hover{transform:translateY(-1px);}
  button.primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  #quizResult{margin-top:14px;font-weight:700;}

  .admin-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:24px;animation:fadeInUp .4s ease;}
  .admin-panel h3{color:var(--yellow);}
  .admin-panel table{width:100%;border-collapse:collapse;font-size:12.5px;color:#dcdad2;}
  .admin-panel th,.admin-panel td{text-align:left;padding:8px;border-bottom:1px solid var(--border);}
  .admin-panel th{background:#111;color:var(--yellow);}
  .admin-panel .reset-btn{background:none;border:1px solid var(--red);color:var(--red);padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer;}
  .admin-panel .reset-btn:hover{background:var(--red);color:#fff;}
  .live-dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:5px;animation:pulseDot 1.5s infinite;}
</style>
</head>

let session = JSON.parse(localStorage.getItem('mebu_session') || 'null');
let progreso = {};
let seccionActual = 0;
let moduloActivo = null;
let adminRefreshTimer = null;
let heartbeatTimer = null;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function apiCall(params) {
  const url = APPS_SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

async function doLogin() {
  const pin = document.getElementById('pinInput').value.trim();
  const errorEl = document.getElementById('loginError');
  const box = document.getElementById('loginScreen');
  if (!pin) return;
  errorEl.textContent = 'Verificando...';
  try {
    const data = await apiCall({ action: 'login', pin });
    if (!data.ok) {
      errorEl.textContent = data.error || 'PIN incorrecto';
      box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 300);
      return;
    }
    session = { pin, nombre: data.nombre, rol: data.rol };
    progreso = data.progreso || {};
    localStorage.setItem('mebu_session', JSON.stringify(session));
    showApp();
  } catch (e) {
    errorEl.textContent = 'No se pudo conectar. Probá de nuevo.';
  }
}

function logout() {
  localStorage.removeItem('mebu_session');
  if (adminRefreshTimer) clearInterval(adminRefreshTimer);
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  session = null;
  location.reload();
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userLabel').textContent = session.nombre + ' · ' + session.rol;
  renderDashboard();
  if (!heartbeatTimer) {
    heartbeatTimer = setInterval(() => apiCall({ action: 'heartbeat', pin: session.pin }), 45000);
  }
}

function isUnlocked(mod, index) {
  if (index === 0) return true;
  const anterior = MODULOS[index - 1];
  return progreso[anterior.id] && progreso[anterior.id].estado === 'Completado';
}

function renderWelcome() {
  const videoHtml = VIDEO_BIENVENIDA_ID
    ? `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${VIDEO_BIENVENIDA_ID}" title="Bienvenida a MEB-U" allowfullscreen></iframe></div>`
    : '';
  return `
    <div class="welcome">
      <h2>¿Qué es MEB-U?</h2>
      ${videoHtml}
      <p>MEB-U es la plataforma propia de capacitación de MEB Machinery Solutions. Acá vas a encontrar los módulos de formación técnica que acompañan la práctica directa con Emmanuel — cada módulo se lee, se mira, y se pone a prueba con una evaluación antes de pasar al siguiente.</p>
    </div>`;
}

function renderDashboard() {
  if (adminRefreshTimer) { clearInterval(adminRefreshTimer); adminRefreshTimer = null; }

  const completados = MODULOS.filter(m => progreso[m.id] && progreso[m.id].estado === 'Completado').length;
  const disponibles = MODULOS.filter(m => m.disponible).length;
  const pct = disponibles ? Math.round((completados / disponibles) * 100) : 0;

  let html = renderWelcome() + `
    <div class="overview">
      <h2>Tu ruta de capacitación</h2>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-label">${completados} de ${disponibles} módulos disponibles completados (${pct}%)</div>
    </div>
    <div class="modules-grid">`;

  MODULOS.forEach((mod, i) => {
    const done = progreso[mod.id] && progreso[mod.id].estado === 'Completado';
    const unlocked = isUnlocked(mod, i) && mod.disponible;
    const cls = done ? 'done' : (unlocked ? '' : 'locked');
    const badge = done ? '<span class="badge done">Completado</span>' : (unlocked ? '<span class="badge available">Disponible</span>' : '<span class="badge locked">Bloqueado</span>');
    html += `
      <div class="module-card ${cls}" onclick="${unlocked ? `openModule('${mod.id}')` : ''}">
        <div class="module-num">${done ? '✓' : mod.numero}</div>
        <div class="module-info"><h3>${mod.titulo}</h3><p>${mod.resumen}</p></div>
        ${badge}
      </div>`;
  });
  html += '</div>';

  if (session.rol === 'Admin') {
    html += `
      <div class="admin-panel" id="adminPanel">
        <h3><span class="live-dot"></span>Panel de seguimiento</h3>
        <div id="adminTableWrap">Cargando...</div>
      </div>`;
  }

  document.getElementById('mainContent').innerHTML = html;
  if (session.rol === 'Admin') {
    loadAdminPanel();
    adminRefreshTimer = setInterval(loadAdminPanel, 20000);
  }
}

async function loadAdminPanel() {
  const data = await apiCall({ action: 'getAllProgress', pin: session.pin });
  const wrap = document.getElementById('adminTableWrap');
  if (!wrap) return;
  if (!data.ok) { wrap.textContent = 'No autorizado.'; return; }
  let table = '<table><tr><th>Operario</th><th>Estado</th>' + MODULOS.map(m => `<th>${m.titulo.split(' —')[0].substring(0,16)}</th>`).join('') + '<th>Manual (html)</th><th>Manual (pdf)</th><th></th></tr>';
  data.usuarios.forEach(u => {
    const estado = u.isOnline
      ? '<span class="live-dot"></span>En línea ahora'
      : u.ultimaActividad;
    table += `<tr><td>${u.nombre}</td><td>${estado}</td>`;
    MODULOS.forEach(m => {
      const reg = u.modulos.find(x => x.Modulo === m.id);
      table += `<td>${reg && reg.Estado === 'Completado' ? '✅ ' + reg.FechaCompletado : '—'}</td>`;
    });
    table += `<td>${u.manualHtmlVisto ? '✅ ' + u.manualHtmlVisto : '—'}</td>`;
    table += `<td>${u.manualPdfVisto ? '✅ ' + u.manualPdfVisto : '—'}</td>`;
    table += `<td><button class="reset-btn" onclick="doReset('${u.pin}','${u.nombre}')">Reiniciar</button></td></tr>`;
  });
  table += '</table>';
  wrap.innerHTML = table;
}

async function doReset(targetPin, nombre) {
  if (!confirm(`¿Reiniciar todo el progreso de ${nombre}? Esta acción no se puede deshacer.`)) return;
  await apiCall({ action: 'resetProgress', adminPin: session.pin, targetPin });
  loadAdminPanel();
}

function openModule(modId) {
  moduloActivo = MODULOS.find(m => m.id === modId);
  seccionActual = 0;
  renderModuleShell(moduloActivo);
  renderSeccion(moduloActivo);
}

function renderModuleShell(mod) {
  document.getElementById('mainContent').innerHTML = `
    <span class="back-link" onclick="renderDashboard()">← Volver a los módulos</span>
    <div class="module-view">
      <h2>Módulo ${mod.numero} — ${mod.titulo}</h2>
      <div class="how-it-works">
        <strong>Cómo se aprueba este módulo:</strong> avanzás sección por sección. Algunas tienen una pregunta corta que hay que responder bien antes de seguir (reintentos ilimitados, sin penalidad). Antes de la evaluación final hay un ejercicio de ordenar pasos. La evaluación final tiene 8 preguntas en orden aleatorio — se necesita <strong>80% o más</strong> para aprobar y desbloquear el siguiente módulo, con reintentos ilimitados.
      </div>
      <div class="resources">
        <a href="${MANUAL_HTML_URL}" target="_blank" onclick="apiCall({action:'logResource',pin:session.pin,recurso:'manualHtml'})">📖 Ver manual completo</a>
        <a href="${MANUAL_PDF_URL}" target="_blank" onclick="apiCall({action:'logResource',pin:session.pin,recurso:'manualPdf'})">⬇ Descargar PDF</a>
      </div>
      <div id="seccionWrap"></div>
    </div>`;
}

function renderBloque(b) {
  switch (b.tipo) {
    case 'texto': return `<div class="media-block">${b.html}</div>`;
    case 'imagen': return `<div class="media-block"><img src="${b.url}" alt="${b.caption || ''}">${b.caption ? `<div class="media-caption">${b.caption}</div>` : ''}</div>`;
    case 'imagen_svg': return `<div class="media-block">${ESQUEMA_MOTOR_SVG}${b.caption ? `<div class="media-caption">${b.caption}</div>` : ''}</div>`;
    case 'video': return `<div class="media-block"><div class="video-wrap"><iframe src="https://www.youtube.com/embed/${b.youtubeId}" title="video" allowfullscreen></iframe></div>${b.caption ? `<div class="media-caption">${b.caption}</div>` : ''}</div>`;
    case 'placeholder': return `<div class="media-block"><div class="media-placeholder">${b.texto}</div></div>`;
    case 'aviso': return `<div class="warn-box">⚠ ${b.texto}</div>`;
    default: return '';
  }
}

function renderSeccion(mod) {
  const idx = seccionActual;
  const sec = mod.secciones[idx];
  const wrap = document.getElementById('seccionWrap');
  let html = sec.bloques.map(renderBloque).join('');

  if (sec.miniquiz) {
    const q = sec.miniquiz;
    const adminSkip = session.rol === 'Admin'
      ? `<button style="background:none;border:1px dashed var(--gray);color:var(--gray);margin-left:8px;padding:9px 14px;border-radius:6px;font-size:11px;cursor:pointer;" onclick="siguienteSeccion()">⏭ Saltar (solo admin)</button>`
      : '';
    html += `
      <div class="mini-check" id="miniCheck">
        <p class="q">${q.pregunta}</p>
        ${q.opciones.map((op, i) => `<label><input type="radio" name="mini" value="${i}"> ${op}</label>`).join('')}
        <div class="feedback" id="miniFeedback"></div>
        <button onclick="checkMini(${idx})">Comprobar</button>
        <button class="next-btn primary" id="miniNextBtn" onclick="siguienteSeccion()">Siguiente sección →</button>
        ${adminSkip}
      </div>`;
  } else {
    const esUltima = idx === mod.secciones.length - 1;
    html += `<div style="margin-top:20px;"><button class="primary" onclick="siguienteSeccion()">${esUltima ? 'Continuar →' : 'Siguiente sección →'}</button></div>`;
  }

  wrap.innerHTML = html;
  wrap.style.animation = 'none'; wrap.offsetHeight; wrap.style.animation = 'fadeInUp .3s ease';
}

function checkMini(idx) {
  const sec = moduloActivo.secciones[idx];
  const sel = document.querySelector('input[name="mini"]:checked');
  const feedback = document.getElementById('miniFeedback');
  const nextBtn = document.getElementById('miniNextBtn');
  if (!sel) { feedback.textContent = 'Elegí una opción.'; feedback.className = 'feedback err'; return; }
  if (parseInt(sel.value) === sec.miniquiz.correcta) {
    feedback.textContent = '✓ Correcto.';
    feedback.className = 'feedback ok';
    nextBtn.style.display = 'inline-block';
  } else {
    feedback.textContent = '✗ No es esa. Probá de nuevo.';
    feedback.className = 'feedback err';
    nextBtn.style.display = 'none';
  }
}

function siguienteSeccion() {
  const mod = moduloActivo;
  seccionActual++;
  if (seccionActual >= mod.secciones.length) {
    if (mod.ordenExercise) renderOrdenExercise(mod);
    else renderQuizFinal(mod);
  } else {
    renderSeccion(mod);
  }
}

let ordenSeleccion = [];
let ordenShuffled = [];

function renderOrdenExercise(mod) {
  const ej = mod.ordenExercise;
  ordenSeleccion = [];
  ordenShuffled = shuffle(ej.pasos.map((texto, i) => ({ texto, correctIdx: i })));

  const items = ordenShuffled.map((item, i) => `
    <button class="orden-item" id="ordenItem${i}" onclick="selectOrden(${i})">
      <span class="num" id="ordenNum${i}"></span>${item.texto}
    </button>`).join('');

  document.getElementById('seccionWrap').innerHTML = `
    <div class="orden-ej">
      <p class="q">${ej.pregunta}</p>
      ${items}
      <div class="feedback" id="ordenFeedback"></div>
      <button onclick="verificarOrden()" id="ordenVerifyBtn" style="display:none;">Verificar orden</button>
      <button onclick="renderOrdenExercise(moduloActivo)" id="ordenRetryBtn" style="display:none;">Reintentar</button>
      <button class="primary" onclick="renderQuizFinal(moduloActivo)" id="ordenNextBtn" style="display:none;margin-left:8px;">Ir a la evaluación final →</button>
      ${session.rol === 'Admin' ? `<button style="background:none;border:1px dashed var(--gray);color:var(--gray);margin-left:8px;padding:9px 14px;border-radius:6px;font-size:11px;cursor:pointer;" onclick="renderQuizFinal(moduloActivo)">⏭ Saltar (solo admin)</button>` : ''}
    </div>`;
}

function selectOrden(i) {
  if (ordenSeleccion.includes(i)) return;
  ordenSeleccion.push(i);
  const btn = document.getElementById('ordenItem' + i);
  btn.classList.add('selected');
  btn.disabled = true;
  document.getElementById('ordenNum' + i).textContent = ordenSeleccion.length;
  document.getElementById('ordenNum' + i).style.display = 'flex';
  if (ordenSeleccion.length === ordenShuffled.length) {
    document.getElementById('ordenVerifyBtn').style.display = 'inline-block';
  }
}

function verificarOrden() {
  let allCorrect = true;
  ordenSeleccion.forEach((itemIdx, posicion) => {
    const item = ordenShuffled[itemIdx];
    const btn = document.getElementById('ordenItem' + itemIdx);
    if (item.correctIdx === posicion) {
      btn.classList.add('correct');
    } else {
      btn.classList.add('incorrect');
      allCorrect = false;
    }
  });
  const feedback = document.getElementById('ordenFeedback');
  document.getElementById('ordenVerifyBtn').style.display = 'none';
  if (allCorrect) {
    feedback.textContent = '✓ Orden correcto.';
    feedback.className = 'feedback ok';
    document.getElementById('ordenNextBtn').style.display = 'inline-block';
  } else {
    feedback.textContent = '✗ Hay pasos fuera de orden (marcados en rojo). Reintentá.';
    feedback.className = 'feedback err';
    document.getElementById('ordenRetryBtn').style.display = 'inline-block';
  }
}

let quizActivo = [];

function renderQuizFinal(mod) {
  quizActivo = shuffle(mod.quiz).map(q => {
    const correctaTexto = q.opciones[q.correcta];
    const opcionesShuffled = shuffle(q.opciones);
    return { pregunta: q.pregunta, opciones: opcionesShuffled, correcta: opcionesShuffled.indexOf(correctaTexto) };
  });

  let html = '<h3>Evaluación final</h3><div id="quizWrap">';
  quizActivo.forEach((q, qi) => {
    html += `<div class="quiz-q"><p>${qi + 1}. ${q.pregunta}</p>`;
    q.opciones.forEach((op, oi) => { html += `<label><input type="radio" name="q${qi}" value="${oi}"> ${op}</label>`; });
    html += '</div>';
  });
  html += '</div><button class="primary" onclick="submitQuiz(\'' + mod.id + '\')">Entregar</button>';
  if (session.rol === 'Admin') {
    html += `<button style="background:none;border:1px dashed var(--gray);color:var(--gray);margin-left:8px;padding:12px 16px;border-radius:6px;font-size:11px;cursor:pointer;" onclick="skipModuleAdmin('${mod.id}')">⏭ Marcar como visto, sin evaluar (solo admin)</button>`;
  }
  html += '<div id="quizResult"></div>';
  document.getElementById('seccionWrap').innerHTML = html;
}

async function skipModuleAdmin(modId) {
  await apiCall({ action: 'completeModule', pin: session.pin, modulo: modId, puntaje: 'admin-skip' });
  const data = await apiCall({ action: 'getProgress', pin: session.pin });
  progreso = data.progreso || {};
  renderDashboard();
}

async function submitQuiz(modId) {
  let correctas = 0;
  quizActivo.forEach((q, qi) => {
    const sel = document.querySelector(`input[name="q${qi}"]:checked`);
    if (sel && parseInt(sel.value) === q.correcta) correctas++;
  });
  const puntaje = Math.round((correctas / quizActivo.length) * 100);
  const resultEl = document.getElementById('quizResult');

  if (puntaje < 80) {
    resultEl.style.color = 'var(--red)';
    resultEl.textContent = `Puntaje: ${puntaje}%. Necesitás al menos 80% para aprobar — repasá y volvé a intentar (sin límite de intentos, preguntas y opciones se reordenan cada vez).`;
    return;
  }

  resultEl.style.color = 'var(--green)';
  resultEl.textContent = `Puntaje: ${puntaje}%. ¡Módulo aprobado! 🎉`;
  await apiCall({ action: 'completeModule', pin: session.pin, modulo: modId, puntaje });
  const data = await apiCall({ action: 'getProgress', pin: session.pin });
  progreso = data.progreso || {};
  setTimeout(renderDashboard, 1400);
}

if (session) { apiCall({ action: 'getProgress', pin: session.pin }).then(d => { progreso = d.progreso || {}; showApp(); }); }
document.getElementById('pinInput').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>

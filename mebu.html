<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEB-U — Capacitación MEB Machinery Solutions</title>
<style>
  :root{
    --black:#1A1A1A; --yellow:#F4B400; --blue:#003B70; --gray:#6E6E6E; --bone:#F5F2EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Barlow',Arial,sans-serif;background:var(--bone);color:var(--black);}
  header{background:var(--black);color:var(--bone);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;}
  header .logo{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:800;font-size:22px;letter-spacing:1px;}
  header .logo span{color:var(--yellow);}
  header .user{font-size:13px;color:var(--gray);}
  header button.logout{background:none;border:1px solid var(--gray);color:var(--bone);padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer;}

  #loginScreen{max-width:360px;margin:80px auto;background:#fff;padding:36px 28px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.08);text-align:center;}
  #loginScreen h1{font-size:28px;margin-bottom:4px;}
  #loginScreen h1 span{color:var(--yellow);}
  #loginScreen p{color:var(--gray);font-size:14px;margin-bottom:24px;}
  #loginScreen input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:6px;border:2px solid #ddd;border-radius:6px;margin-bottom:16px;}
  #loginScreen button{width:100%;padding:14px;background:var(--yellow);border:none;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;}
  #loginError{color:#c0392b;font-size:13px;margin-top:10px;min-height:16px;}

  main{max-width:820px;margin:0 auto;padding:30px 20px 80px;}
  .modules-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  .module-card{background:#fff;border-radius:10px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,0.05);cursor:pointer;transition:transform .15s;}
  .module-card.locked{opacity:.55;cursor:not-allowed;}
  .module-card:not(.locked):hover{transform:translateY(-2px);}
  .module-num{width:44px;height:44px;border-radius:50%;background:var(--black);color:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;}
  .module-card.locked .module-num{background:#ccc;color:#888;}
  .module-card.done .module-num{background:#2e7d32;color:#fff;}
  .module-info h3{margin:0 0 4px;font-size:17px;}
  .module-info p{margin:0;font-size:13px;color:var(--gray);}
  .badge{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;padding:4px 10px;border-radius:20px;}
  .badge.done{background:#e8f5e9;color:#2e7d32;}
  .badge.locked{background:#eee;color:#888;}
  .badge.available{background:#FFF3D6;color:#8a6300;}

  .module-view{background:#fff;border-radius:10px;padding:28px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
  .module-view h2{color:var(--blue);border-bottom:3px solid var(--yellow);padding-bottom:8px;}
  .module-view h3{color:var(--blue);margin-top:28px;}
  .module-view ol{padding-left:20px;line-height:1.7;}
  .module-view ul{padding-left:20px;line-height:1.7;}
  .back-link{display:inline-block;margin-bottom:16px;color:var(--gray);text-decoration:none;font-size:13px;cursor:pointer;}
  .media-placeholder{background:#f2f2f2;border:2px dashed #ccc;border-radius:8px;padding:22px;text-align:center;color:#888;font-size:13px;margin:14px 0;}
  .warn-box{background:#FFF3D6;border-left:4px solid var(--yellow);padding:14px 16px;margin:16px 0;font-weight:600;font-size:14px;border-radius:4px;}

  .quiz-q{background:var(--bone);padding:16px;border-radius:8px;margin-bottom:14px;}
  .quiz-q p{font-weight:600;margin-bottom:8px;}
  .quiz-q label{display:block;padding:8px 10px;background:#fff;border:1px solid #ddd;border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:14px;}
  .quiz-q label:hover{border-color:var(--yellow);}
  .quiz-q input{margin-right:8px;}

  button.primary{background:var(--yellow);border:none;padding:12px 24px;border-radius:6px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;font-size:13px;}
  #quizResult{margin-top:14px;font-weight:700;}

  .admin-panel{background:#fff;border-radius:10px;padding:20px;margin-top:24px;}
  .admin-panel table{width:100%;border-collapse:collapse;font-size:13px;}
  .admin-panel th,.admin-panel td{text-align:left;padding:8px;border-bottom:1px solid #eee;}
  .admin-panel th{background:var(--black);color:#fff;}
</style>
</head>
<body>

<div id="loginScreen">
  <h1>MEB<span>-U</span></h1>
  <p>Plataforma de capacitación — MEB Machinery Solutions</p>
  <input type="password" id="pinInput" maxlength="6" placeholder="••••" inputmode="numeric">
  <button onclick="doLogin()">Ingresar</button>
  <div id="loginError"></div>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="logo">MEB<span>-U</span></div>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="user" id="userLabel"></span>
      <button class="logout" onclick="logout()">Salir</button>
    </div>
  </header>
  <main id="mainContent"></main>
</div>

<script>
/* ============ CONFIGURACIÓN ============ */
// Reemplazar por la URL del deployment del Code.gs de MEB-U (independiente del CRM)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXlP-IHCWkEqQ_XdW7pUlKR05t5VdxKrSTZ3BtlRdAFxKvyAF5kr-_MuKlNwox6emP/exec';

/* ============ CONTENIDO DE MÓDULOS ============
   Los módulos 2+ están como placeholder — se van completando con el mismo
   formato cuando estén listos los contenidos reales (fotos, video, texto). */
const MODULOS = [
  {
    id: 'modulo1',
    numero: 1,
    titulo: 'Cambio de aceite y filtros + Inspección visual',
    resumen: 'Procedimiento completo de mantenimiento base (hito 250hs)',
    disponible: true,
    contenidoHtml: `
      <h3>Cómo usar este módulo</h3>
      <p>Este contenido es un apoyo a la formación práctica con Emmanuel, no la reemplaza. Mirá el video, leé el procedimiento, y recién después practicá junto a él.</p>

      <div class="media-placeholder">🎥 VIDEO — Emmanuel realizando el cambio de aceite completo (a insertar)</div>

      <h3>1. Seguridad antes de empezar</h3>
      <ul>
        <li>Máquina nivelada, freno de estacionamiento y calzas colocadas.</li>
        <li>Motor tibio (no caliente) para el drenaje.</li>
        <li>EPP colocado: guantes, anteojos, ropa de trabajo.</li>
        <li>Fluidos usados siempre en recipientes homologados — nunca al suelo.</li>
      </ul>

      <h3>2. Inspección visual previa</h3>
      <div class="media-placeholder">📷 FOTO — Puntos de inspección típicos señalados sobre una máquina real de MEB (a insertar)</div>
      <ol>
        <li>Registrar horómetro.</li>
        <li>Revisar fugas visibles (aceite, combustible, refrigerante, hidráulico).</li>
        <li>Revisar mangueras y correas.</li>
        <li>Verificar nivel y color del aceite con la varilla.</li>
        <li>Revisar filtro de aire externo, neumáticos/orugas, luces y alarma de retroceso.</li>
      </ol>
      <div class="warn-box">⚠ Cualquier anomalía se registra en el Informe Técnico ANTES de intervenir.</div>

      <h3>3. Cambio de aceite de motor</h3>
      <div class="media-placeholder">📷 FOTO — Ubicación real del tapón de drenaje (a insertar, por marca/modelo)</div>
      <ol>
        <li>Ubicar bandeja bajo el tapón de drenaje.</li>
        <li>Aflojar y retirar el tapón — el aceite sale caliente.</li>
        <li>Dejar drenar 10-15 minutos.</li>
        <li>Revisar tapón y junta; reemplazar junta si está dañada.</li>
        <li>Colocar tapón con el torque indicado por el fabricante.</li>
        <li>Llenar con el aceite especificado en la orden de trabajo.</li>
        <li>Verificar nivel con varilla, arrancar, chequear fugas.</li>
      </ol>

      <h3>4. Filtro de aceite</h3>
      <div class="media-placeholder">📷 FOTO — Filtro de aceite antes/después del cambio (a insertar)</div>
      <ol>
        <li>Aflojar en sentido antihorario, con bandeja debajo.</li>
        <li>Verificar que el o-ring viejo salió completo.</li>
        <li>Lubricar o-ring del filtro nuevo con aceite limpio.</li>
        <li>Enroscar a mano hasta contacto + 3/4 de vuelta. No usar llave salvo indicación del fabricante.</li>
      </ol>

      <h3>5. Filtro de combustible</h3>
      <p>Sistema sensible al ingreso de aire y suciedad — extremar la limpieza del entorno antes de abrir el circuito. Purgar el sistema si el modelo tiene cebador manual.</p>

      <h3>6. Filtro de aire</h3>
      <p>Inspeccionar roturas o desgaste. No lavar elementos de papel. El elemento de seguridad (si tiene doble filtro) nunca se limpia, solo se reemplaza.</p>

      <h3>7. Cierre</h3>
      <p>Cargar Informe Técnico en el CRM con horómetro, insumos utilizados, hallazgos y fotos antes/después. Avisar a Emmanuel para validar si es la primera vez sola la tarea.</p>
    `,
    quiz: [
      {
        pregunta: '¿En qué momento se debe estar el motor para drenar el aceite?',
        opciones: ['Frío, recién arrancado', 'Tibio, no caliente', 'Caliente, recién apagado', 'No importa la temperatura'],
        correcta: 1,
      },
      {
        pregunta: '¿Qué se hace si el o-ring del filtro viejo queda pegado al motor?',
        opciones: ['Se deja, no afecta', 'Se retira manualmente antes de colocar el nuevo filtro', 'Se coloca el nuevo filtro encima', 'Se reemplaza todo el motor'],
        correcta: 1,
      },
      {
        pregunta: '¿Con qué se ajusta el filtro de aceite nuevo, salvo indicación contraria del fabricante?',
        opciones: ['Con llave de filtro, fuerte', 'A mano, hasta contacto + 3/4 de vuelta', 'Con pinza', 'No se ajusta'],
        correcta: 1,
      },
      {
        pregunta: '¿Qué se hace con un elemento de filtro de aire de papel roto?',
        opciones: ['Se lava con agua', 'Se sopla con aire comprimido a alta presión', 'Se reemplaza', 'Se sigue usando si filtra la mayoría'],
        correcta: 2,
      },
      {
        pregunta: '¿Dónde se registran las anomalías detectadas en la inspección visual previa?',
        opciones: ['No se registran si no son del tema del día', 'En el Informe Técnico, antes de intervenir', 'Solo se comentan de palabra', 'Se anotan al final del día'],
        correcta: 1,
      },
    ],
  },
  { id: 'modulo2', numero: 2, titulo: 'Próximamente', resumen: 'Sistema hidráulico — en preparación', disponible: false, contenidoHtml: '', quiz: [] },
  { id: 'modulo3', numero: 3, titulo: 'Próximamente', resumen: 'Diagnóstico computarizado básico — en preparación', disponible: false, contenidoHtml: '', quiz: [] },
];

/* ============ ESTADO ============ */
let session = JSON.parse(localStorage.getItem('mebu_session') || 'null');
let progreso = {};

/* ============ API ============ */
async function apiCall(params) {
  const url = APPS_SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

async function doLogin() {
  const pin = document.getElementById('pinInput').value.trim();
  const errorEl = document.getElementById('loginError');
  if (!pin) return;
  errorEl.textContent = 'Verificando...';
  try {
    const data = await apiCall({ action: 'login', pin });
    if (!data.ok) { errorEl.textContent = data.error || 'PIN incorrecto'; return; }
    session = { pin, nombre: data.nombre, rol: data.rol };
    progreso = data.progreso || {};
    localStorage.setItem('mebu_session', JSON.stringify(session));
    showApp();
  } catch (e) {
    errorEl.textContent = 'No se pudo conectar. Probá de nuevo.';
  }
}

function logout() {
  localStorage.removeItem('mebu_session');
  session = null;
  location.reload();
}

/* ============ VISTAS ============ */
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userLabel').textContent = session.nombre + ' · ' + session.rol;
  renderDashboard();
}

function isUnlocked(mod, index) {
  if (index === 0) return true;
  const anterior = MODULOS[index - 1];
  return progreso[anterior.id] && progreso[anterior.id].estado === 'Completado';
}

function renderDashboard() {
  let html = '<h2 style="color:var(--blue)">Ruta de capacitación</h2><div class="modules-grid">';
  MODULOS.forEach((mod, i) => {
    const done = progreso[mod.id] && progreso[mod.id].estado === 'Completado';
    const unlocked = isUnlocked(mod, i) && mod.disponible;
    const cls = done ? 'done' : (unlocked ? '' : 'locked');
    const badge = done ? '<span class="badge done">Completado</span>' : (unlocked ? '<span class="badge available">Disponible</span>' : '<span class="badge locked">Bloqueado</span>');
    html += `
      <div class="module-card ${cls}" onclick="${unlocked ? `openModule('${mod.id}')` : ''}">
        <div class="module-num">${done ? '✓' : mod.numero}</div>
        <div class="module-info"><h3>${mod.titulo}</h3><p>${mod.resumen}</p></div>
        ${badge}
      </div>`;
  });
  html += '</div>';

  if (session.rol === 'Admin') {
    html += '<div class="admin-panel" id="adminPanel"><h3 style="color:var(--blue)">Panel de seguimiento</h3><div id="adminTableWrap">Cargando...</div></div>';
  }

  document.getElementById('mainContent').innerHTML = html;
  if (session.rol === 'Admin') loadAdminPanel();
}

async function loadAdminPanel() {
  const data = await apiCall({ action: 'getAllProgress', pin: session.pin });
  if (!data.ok) { document.getElementById('adminTableWrap').textContent = 'No autorizado.'; return; }
  let table = '<table><tr><th>Operario</th>' + MODULOS.map(m => `<th>${m.titulo.split(' —')[0].substring(0,18)}</th>`).join('') + '</tr>';
  data.usuarios.forEach(u => {
    table += `<tr><td>${u.nombre}</td>`;
    MODULOS.forEach(m => {
      const reg = u.modulos.find(x => x.Modulo === m.id);
      table += `<td>${reg ? '✅ ' + reg.FechaCompletado : '—'}</td>`;
    });
    table += '</tr>';
  });
  table += '</table>';
  document.getElementById('adminTableWrap').innerHTML = table;
}

function openModule(modId) {
  const mod = MODULOS.find(m => m.id === modId);
  let html = `<span class="back-link" onclick="renderDashboard()">← Volver a los módulos</span>
    <div class="module-view">
      <h2>Módulo ${mod.numero} — ${mod.titulo}</h2>
      ${mod.contenidoHtml}
      <h3>Puesta a prueba</h3>
      <div id="quizWrap"></div>
      <button class="primary" onclick="submitQuiz('${mod.id}')">Entregar</button>
      <div id="quizResult"></div>
    </div>`;
  document.getElementById('mainContent').innerHTML = html;
  renderQuiz(mod);
}

function renderQuiz(mod) {
  let html = '';
  mod.quiz.forEach((q, qi) => {
    html += `<div class="quiz-q"><p>${qi + 1}. ${q.pregunta}</p>`;
    q.opciones.forEach((op, oi) => {
      html += `<label><input type="radio" name="q${qi}" value="${oi}"> ${op}</label>`;
    });
    html += '</div>';
  });
  document.getElementById('quizWrap').innerHTML = html;
}

async function submitQuiz(modId) {
  const mod = MODULOS.find(m => m.id === modId);
  let correctas = 0;
  mod.quiz.forEach((q, qi) => {
    const sel = document.querySelector(`input[name="q${qi}"]:checked`);
    if (sel && parseInt(sel.value) === q.correcta) correctas++;
  });
  const puntaje = Math.round((correctas / mod.quiz.length) * 100);
  const resultEl = document.getElementById('quizResult');

  if (puntaje < 80) {
    resultEl.style.color = '#c0392b';
    resultEl.textContent = `Puntaje: ${puntaje}%. Necesitás al menos 80% para aprobar — repasá el módulo y volvé a intentar.`;
    return;
  }

  resultEl.style.color = '#2e7d32';
  resultEl.textContent = `Puntaje: ${puntaje}%. ¡Módulo aprobado!`;
  await apiCall({ action: 'completeModule', pin: session.pin, modulo: modId, puntaje });
  const data = await apiCall({ action: 'getProgress', pin: session.pin });
  progreso = data.progreso || {};
  setTimeout(renderDashboard, 1200);
}

/* ============ INIT ============ */
if (session) { apiCall({ action: 'getProgress', pin: session.pin }).then(d => { progreso = d.progreso || {}; showApp(); }); }
document.getElementById('pinInput').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>

<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --black:#1A1A1A; --yellow:#F4B400; --blue:#003B70; --gray:#6E6E6E; --bone:#F5F2EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Barlow',Arial,sans-serif;background:var(--bone);color:var(--black);}
  header{background:var(--black);color:var(--bone);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand img{height:34px;width:34px;border-radius:7px;}
  header .brand .txt{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:800;font-size:20px;letter-spacing:1px;}
  header .brand .txt span{color:var(--yellow);}
  header .user{font-size:12px;color:#bbb;}
  header button.logout{background:none;border:1px solid var(--gray);color:var(--bone);padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer;}
  header button.logout:hover{border-color:var(--yellow);color:var(--yellow);}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  @keyframes fillBar{from{width:0;}}

  #loginScreen{max-width:360px;margin:70px auto;background:#fff;padding:36px 28px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.1);text-align:center;animation:fadeInUp .4s ease;}
  #loginScreen img.logo{width:64px;height:64px;border-radius:14px;margin-bottom:10px;}
  #loginScreen h1{font-size:26px;margin:6px 0 2px;}
  #loginScreen h1 span{color:var(--yellow);}
  #loginScreen p{color:var(--gray);font-size:13px;margin-bottom:22px;}
  #loginScreen input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:6px;border:2px solid #ddd;border-radius:6px;margin-bottom:16px;transition:border-color .2s;}
  #loginScreen input:focus{outline:none;border-color:var(--yellow);}
  #loginScreen button{width:100%;padding:14px;background:var(--yellow);border:none;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:transform .15s;}
  #loginScreen button:hover{transform:translateY(-1px);}
  #loginError{color:#c0392b;font-size:13px;margin-top:10px;min-height:16px;}
  #loginScreen .hint{font-size:11px;color:var(--gray);margin-top:18px;border-top:1px solid #eee;padding-top:14px;}
  .shake{animation:shake .3s;}

  main{max-width:820px;margin:0 auto;padding:26px 18px 80px;}
  .overview{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;animation:fadeInUp .4s ease;}
  .overview .bar-track{background:#eee;border-radius:20px;height:10px;overflow:hidden;margin-top:10px;}
  .overview .bar-fill{background:linear-gradient(90deg,var(--yellow),#ffd257);height:100%;border-radius:20px;animation:fillBar 1s ease;}
  .overview .bar-label{font-size:12px;color:var(--gray);margin-top:6px;}

  .modules-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  .module-card{background:#fff;border-radius:10px;padding:18px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,0.05);cursor:pointer;transition:transform .15s,box-shadow .15s;animation:fadeInUp .45s ease backwards;}
  .module-card:nth-child(1){animation-delay:.02s;} .module-card:nth-child(2){animation-delay:.08s;} .module-card:nth-child(3){animation-delay:.14s;}
  .module-card.locked{opacity:.55;cursor:not-allowed;}
  .module-card:not(.locked):hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.1);}
  .module-num{width:44px;height:44px;border-radius:50%;background:var(--black);color:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;transition:background .3s;}
  .module-card.locked .module-num{background:#ccc;color:#888;}
  .module-card.done .module-num{background:#2e7d32;color:#fff;animation:popIn .4s ease;}
  .module-info h3{margin:0 0 4px;font-size:17px;}
  .module-info p{margin:0;font-size:13px;color:var(--gray);}
  .badge{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;padding:4px 10px;border-radius:20px;flex-shrink:0;}
  .badge.done{background:#e8f5e9;color:#2e7d32;}
  .badge.locked{background:#eee;color:#888;}
  .badge.available{background:#FFF3D6;color:#8a6300;}

  .module-view{background:#fff;border-radius:12px;padding:26px;box-shadow:0 2px 8px rgba(0,0,0,0.05);animation:fadeInUp .35s ease;}
  .module-view h2{color:var(--blue);border-bottom:3px solid var(--yellow);padding-bottom:8px;}
  .module-view h3{color:var(--blue);margin-top:26px;}
  .module-view ol,.module-view ul{padding-left:20px;line-height:1.7;}
  .back-link{display:inline-block;margin-bottom:16px;color:var(--gray);text-decoration:none;font-size:13px;cursor:pointer;}
  .back-link:hover{color:var(--blue);}

  .how-it-works{background:#eef4fa;border:1px solid #d6e5f2;border-radius:8px;padding:14px 16px;margin-bottom:20px;font-size:13px;line-height:1.6;}
  .how-it-works strong{color:var(--blue);}

  .media-block{margin:16px 0;}
  .media-block img{width:100%;border-radius:8px;display:block;}
  .media-block .video-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden;}
  .media-block .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
  .media-caption{font-size:12.5px;color:var(--gray);margin-top:6px;font-style:italic;}
  .media-placeholder{background:#f2f2f2;border:2px dashed #ccc;border-radius:8px;padding:22px;text-align:center;color:#888;font-size:13px;}
  .warn-box{background:#FFF3D6;border-left:4px solid var(--yellow);padding:14px 16px;margin:16px 0;font-weight:600;font-size:14px;border-radius:4px;}

  .mini-check{background:var(--bone);border:1px solid #e8e2d5;padding:16px;border-radius:8px;margin:18px 0;}
  .mini-check p.q{font-weight:700;margin-bottom:10px;}
  .mini-check label{display:block;padding:9px 12px;background:#fff;border:1px solid #ddd;border-radius:6px;margin-bottom:7px;cursor:pointer;font-size:14px;transition:border-color .15s;}
  .mini-check label:hover{border-color:var(--yellow);}
  .mini-check input{margin-right:8px;}
  .mini-check .feedback{font-size:13px;font-weight:700;margin-top:8px;min-height:18px;}
  .mini-check .feedback.ok{color:#2e7d32;}
  .mini-check .feedback.err{color:#c0392b;}
  .mini-check button{margin-top:8px;background:var(--black);color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;}
  .mini-check .next-btn{display:none;background:var(--yellow);color:var(--black);}

  .quiz-q{background:var(--bone);padding:16px;border-radius:8px;margin-bottom:14px;}
  .quiz-q p{font-weight:600;margin-bottom:8px;}
  .quiz-q label{display:block;padding:8px 10px;background:#fff;border:1px solid #ddd;border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:14px;}
  .quiz-q label:hover{border-color:var(--yellow);}
  .quiz-q input{margin-right:8px;}

  button.primary{background:var(--yellow);border:none;padding:12px 24px;border-radius:6px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;font-size:13px;transition:transform .15s;}
  button.primary:hover{transform:translateY(-1px);}
  button.primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  #quizResult{margin-top:14px;font-weight:700;}

  .admin-panel{background:#fff;border-radius:12px;padding:20px;margin-top:24px;animation:fadeInUp .4s ease;}
  .admin-panel table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .admin-panel th,.admin-panel td{text-align:left;padding:8px;border-bottom:1px solid #eee;}
  .admin-panel th{background:var(--black);color:#fff;}
  .admin-panel .reset-btn{background:none;border:1px solid #c0392b;color:#c0392b;padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer;}
  .admin-panel .reset-btn:hover{background:#c0392b;color:#fff;}
  .live-dot{display:inline-block;width:7px;height:7px;background:#2e7d32;border-radius:50%;margin-right:5px;animation:pulseDot 1.5s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}
</style>
</head>

          { tipo: 'texto', html: '<h3>5. Filtro de combustible</h3><p>Sistema sensible al ingreso de aire y suciedad — extremar la limpieza del entorno antes de abrir el circuito. Purgar el sistema si el modelo tiene cebador manual.</p><h3>6. Filtro de aire</h3><p>Inspeccionar roturas o desgaste. No lavar elementos de papel. El elemento de seguridad (si tiene doble filtro) nunca se limpia, solo se reemplaza.</p>' },
        ],
      },
      {
        bloques: [
          { tipo: 'texto', html: '<h3>7. Cierre</h3><p>Cargar Informe Técnico en el CRM con horómetro, insumos utilizados, hallazgos y fotos antes/después. Avisar a Emmanuel para validar si es la primera vez sola la tarea.</p>' },
        ],
      },
    ],
    quiz: [
      { pregunta: '¿En qué momento se debe estar el motor para drenar el aceite?', opciones: ['Frío, recién arrancado', 'Tibio, no caliente', 'Caliente, recién apagado', 'No importa la temperatura'], correcta: 1 },
      { pregunta: '¿Qué se hace si el o-ring del filtro viejo queda pegado al motor?', opciones: ['Se deja, no afecta', 'Se retira manualmente antes de colocar el nuevo filtro', 'Se coloca el nuevo filtro encima', 'Se reemplaza todo el motor'], correcta: 1 },
      { pregunta: '¿Con qué se ajusta el filtro de aceite nuevo, salvo indicación contraria del fabricante?', opciones: ['Con llave de filtro, fuerte', 'A mano, hasta contacto + 3/4 de vuelta', 'Con pinza', 'No se ajusta'], correcta: 1 },
      { pregunta: '¿Qué se hace con un elemento de filtro de aire de papel roto?', opciones: ['Se lava con agua', 'Se sopla con aire comprimido a alta presión', 'Se reemplaza', 'Se sigue usando si filtra la mayoría'], correcta: 2 },
      { pregunta: '¿Dónde se registran las anomalías detectadas en la inspección visual previa?', opciones: ['No se registran si no son del tema del día', 'En el Informe Técnico, antes de intervenir', 'Solo se comentan de palabra', 'Se anotan al final del día'], correcta: 1 },
    ],
  },
  { id: 'modulo2', numero: 2, titulo: 'Próximamente', resumen: 'Sistema hidráulico — en preparación', disponible: false, secciones: [], quiz: [] },
  { id: 'modulo3', numero: 3, titulo: 'Próximamente', resumen: 'Diagnóstico computarizado básico — en preparación', disponible: false, secciones: [], quiz: [] },
];

/* ============ ESTADO ============ */
let session = JSON.parse(localStorage.getItem('mebu_session') || 'null');
let progreso = {};
let seccionActual = 0;
let seccionesAprobadas = [];
let adminRefreshTimer = null;

/* ============ API ============ */
async function apiCall(params) {
  const url = APPS_SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

async function doLogin() {
  const pin = document.getElementById('pinInput').value.trim();
  const errorEl = document.getElementById('loginError');
  const box = document.getElementById('loginScreen');
  if (!pin) return;
  errorEl.textContent = 'Verificando...';
  try {
    const data = await apiCall({ action: 'login', pin });
    if (!data.ok) {
      errorEl.textContent = data.error || 'PIN incorrecto';
      box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 300);
      return;
    }
    session = { pin, nombre: data.nombre, rol: data.rol };
    progreso = data.progreso || {};
    localStorage.setItem('mebu_session', JSON.stringify(session));
    showApp();
  } catch (e) {
    errorEl.textContent = 'No se pudo conectar. Probá de nuevo.';
  }
}

function logout() {
  localStorage.removeItem('mebu_session');
  if (adminRefreshTimer) clearInterval(adminRefreshTimer);
  session = null;
  location.reload();
}

/* ============ VISTAS ============ */
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userLabel').textContent = session.nombre + ' · ' + session.rol;
  renderDashboard();
}

function isUnlocked(mod, index) {
  if (index === 0) return true;
  const anterior = MODULOS[index - 1];
  return progreso[anterior.id] && progreso[anterior.id].estado === 'Completado';
}

function renderDashboard() {
  if (adminRefreshTimer) { clearInterval(adminRefreshTimer); adminRefreshTimer = null; }

  const completados = MODULOS.filter(m => progreso[m.id] && progreso[m.id].estado === 'Completado').length;
  const disponibles = MODULOS.filter(m => m.disponible).length;
  const pct = disponibles ? Math.round((completados / disponibles) * 100) : 0;

  let html = `
    <div class="overview">
      <h2 style="margin:0 0 4px;color:var(--blue)">Tu ruta de capacitación</h2>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-label">${completados} de ${disponibles} módulos disponibles completados (${pct}%)</div>
    </div>
    <div class="modules-grid">`;

  MODULOS.forEach((mod, i) => {
    const done = progreso[mod.id] && progreso[mod.id].estado === 'Completado';
    const unlocked = isUnlocked(mod, i) && mod.disponible;
    const cls = done ? 'done' : (unlocked ? '' : 'locked');
    const badge = done ? '<span class="badge done">Completado</span>' : (unlocked ? '<span class="badge available">Disponible</span>' : '<span class="badge locked">Bloqueado</span>');
    html += `
      <div class="module-card ${cls}" onclick="${unlocked ? `openModule('${mod.id}')` : ''}">
        <div class="module-num">${done ? '✓' : mod.numero}</div>
        <div class="module-info"><h3>${mod.titulo}</h3><p>${mod.resumen}</p></div>
        ${badge}
      </div>`;
  });
  html += '</div>';

  if (session.rol === 'Admin') {
    html += `
      <div class="admin-panel" id="adminPanel">
        <h3 style="color:var(--blue);margin-top:0"><span class="live-dot"></span>Panel de seguimiento</h3>
        <div id="adminTableWrap">Cargando...</div>
      </div>`;
  }

  document.getElementById('mainContent').innerHTML = html;
  if (session.rol === 'Admin') {
    loadAdminPanel();
    adminRefreshTimer = setInterval(loadAdminPanel, 20000);
  }
}

async function loadAdminPanel() {
  const data = await apiCall({ action: 'getAllProgress', pin: session.pin });
  const wrap = document.getElementById('adminTableWrap');
  if (!wrap) return;
  if (!data.ok) { wrap.textContent = 'No autorizado.'; return; }
  let table = '<table><tr><th>Operario</th><th>Última actividad</th>' + MODULOS.map(m => `<th>${m.titulo.split(' —')[0].substring(0,16)}</th>`).join('') + '<th></th></tr>';
  data.usuarios.forEach(u => {
    table += `<tr><td>${u.nombre}</td><td>${u.ultimaActividad}</td>`;
    MODULOS.forEach(m => {
      const reg = u.modulos.find(x => x.Modulo === m.id);
      table += `<td>${reg && reg.Estado === 'Completado' ? '✅ ' + reg.FechaCompletado : '—'}</td>`;
    });
    table += `<td><button class="reset-btn" onclick="doReset('${u.pin}','${u.nombre}')">Reiniciar</button></td></tr>`;
  });
  table += '</table>';
  wrap.innerHTML = table;
}

async function doReset(targetPin, nombre) {
  if (!confirm(`¿Reiniciar todo el progreso de ${nombre}? Esta acción no se puede deshacer.`)) return;
  await apiCall({ action: 'resetProgress', adminPin: session.pin, targetPin });
  loadAdminPanel();
}

/* ---------- Módulo: render por secciones ---------- */
let moduloActivo = null;

function openModule(modId) {
  moduloActivo = MODULOS.find(m => m.id === modId);
  seccionActual = 0;
  renderModuleShell(moduloActivo);
  renderSeccion(moduloActivo);
}

function renderModuleShell(mod) {
  document.getElementById('mainContent').innerHTML = `
    <span class="back-link" onclick="renderDashboard()">← Volver a los módulos</span>
    <div class="module-view">
      <h2>Módulo ${mod.numero} — ${mod.titulo}</h2>
      <div class="how-it-works">
        <strong>Cómo se aprueba este módulo:</strong> avanzás sección por sección. Algunas tienen una pregunta corta que hay que responder bien antes de seguir (podés reintentar las veces que quieras, no hay penalidad por errar). Al final hay una evaluación integradora de 5 preguntas — se necesita <strong>80% o más</strong> para aprobar y desbloquear el siguiente módulo. También podés reintentarla si no llegás al puntaje.
      </div>
      <div id="seccionWrap"></div>
    </div>`;
}

function renderBloque(b) {
  switch (b.tipo) {
    case 'texto': return `<div class="media-block">${b.html}</div>`;
    case 'imagen': return `<div class="media-block"><img src="${b.url}" alt="${b.caption || ''}">${b.caption ? `<div class="media-caption">${b.caption}</div>` : ''}</div>`;
    case 'video': return `<div class="media-block"><div class="video-wrap"><iframe src="https://www.youtube.com/embed/${b.youtubeId}" title="video" allowfullscreen></iframe></div>${b.caption ? `<div class="media-caption">${b.caption}</div>` : ''}</div>`;
    case 'placeholder': return `<div class="media-block"><div class="media-placeholder">${b.texto}</div></div>`;
    case 'aviso': return `<div class="warn-box">⚠ ${b.texto}</div>`;
    default: return '';
  }
}

function renderSeccion(mod) {
  const idx = seccionActual;
  const sec = mod.secciones[idx];
  const wrap = document.getElementById('seccionWrap');
  let html = sec.bloques.map(renderBloque).join('');

  if (sec.miniquiz) {
    const q = sec.miniquiz;
    html += `
      <div class="mini-check" id="miniCheck">
        <p class="q">${q.pregunta}</p>
        ${q.opciones.map((op, i) => `<label><input type="radio" name="mini" value="${i}"> ${op}</label>`).join('')}
        <div class="feedback" id="miniFeedback"></div>
        <button onclick="checkMini(${idx})">Comprobar</button>
        <button class="next-btn" id="miniNextBtn" onclick="siguienteSeccion('${mod.id}')">Siguiente sección →</button>
      </div>`;
  } else {
    html += `<div style="margin-top:20px;"><button class="primary" onclick="siguienteSeccion('${mod.id}')">${idx === mod.secciones.length - 1 ? 'Ir a la evaluación final' : 'Siguiente sección →'}</button></div>`;
  }

  wrap.innerHTML = html;
  wrap.style.animation = 'none'; wrap.offsetHeight; wrap.style.animation = 'fadeInUp .3s ease';
}

function checkMini(idx) {
  const sec = moduloActivo.secciones[idx];
  const sel = document.querySelector('input[name="mini"]:checked');
  const feedback = document.getElementById('miniFeedback');
  const nextBtn = document.getElementById('miniNextBtn');
  if (!sel) { feedback.textContent = 'Elegí una opción.'; feedback.className = 'feedback err'; return; }
  if (parseInt(sel.value) === sec.miniquiz.correcta) {
    feedback.textContent = '✓ Correcto.';
    feedback.className = 'feedback ok';
    nextBtn.style.display = 'inline-block';
  } else {
    feedback.textContent = '✗ No es esa. Probá de nuevo.';
    feedback.className = 'feedback err';
    nextBtn.style.display = 'none';
  }
}

function siguienteSeccion(modId) {
  const mod = moduloActivo;
  seccionActual++;
  if (seccionActual >= mod.secciones.length) {
    renderQuizFinal(mod);
  } else {
    renderSeccion(mod);
  }
}

function renderQuizFinal(mod) {
  let html = '<h3>Evaluación final</h3><div id="quizWrap">';
  mod.quiz.forEach((q, qi) => {
    html += `<div class="quiz-q"><p>${qi + 1}. ${q.pregunta}</p>`;
    q.opciones.forEach((op, oi) => { html += `<label><input type="radio" name="q${qi}" value="${oi}"> ${op}</label>`; });
    html += '</div>';
  });
  html += '</div><button class="primary" onclick="submitQuiz(\'' + mod.id + '\')">Entregar</button><div id="quizResult"></div>';
  document.getElementById('seccionWrap').innerHTML = html;
}

async function submitQuiz(modId) {
  const mod = MODULOS.find(m => m.id === modId);
  let correctas = 0;
  mod.quiz.forEach((q, qi) => {
    const sel = document.querySelector(`input[name="q${qi}"]:checked`);
    if (sel && parseInt(sel.value) === q.correcta) correctas++;
  });
  const puntaje = Math.round((correctas / mod.quiz.length) * 100);
  const resultEl = document.getElementById('quizResult');

  if (puntaje < 80) {
    resultEl.style.color = '#c0392b';
    resultEl.textContent = `Puntaje: ${puntaje}%. Necesitás al menos 80% para aprobar — repasá y volvé a intentar (sin límite de intentos).`;
    return;
  }

  resultEl.style.color = '#2e7d32';
  resultEl.textContent = `Puntaje: ${puntaje}%. ¡Módulo aprobado! 🎉`;
  await apiCall({ action: 'completeModule', pin: session.pin, modulo: modId, puntaje });
  const data = await apiCall({ action: 'getProgress', pin: session.pin });
  progreso = data.progreso || {};
  setTimeout(renderDashboard, 1400);
}

/* ============ INIT ============ */
if (session) { apiCall({ action: 'getProgress', pin: session.pin }).then(d => { progreso = d.progreso || {}; showApp(); }); }
document.getElementById('pinInput').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
</script>

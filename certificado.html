<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado — MEB-U</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root{--yellow:#F4B400;--black:#1A1A1A;--gray:#6E6E6E;}
  *{box-sizing:border-box;}
  body{margin:0;background:#e9e9e9;font-family:'Barlow',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:30px 16px;}
  .toolbar{max-width:900px;width:100%;display:flex;justify-content:flex-end;gap:10px;margin-bottom:16px;}
  .toolbar button{background:var(--black);color:#fff;border:none;padding:10px 18px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;}
  .toolbar button:hover{background:#333;}
  .toolbar button.salir{background:#fff;color:var(--black);border:1px solid #ccc;}
  .toolbar button.salir:hover{background:#f2f2f2;}
  .page{background:#fff;width:100%;max-width:900px;min-height:636px;padding:26px;box-shadow:0 4px 20px rgba(0,0,0,.15);}
  .cert-border{border:7px solid var(--yellow);border-radius:22px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 50px;position:relative;}
  .cert-border img.logo{height:44px;width:auto;margin-bottom:18px;}
  .cert-title{font-family:'Bebas Neue';font-size:34px;letter-spacing:2px;color:var(--black);margin:0 0 4px;}
  .cert-sub{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-bottom:30px;}
  .cert-body{font-size:16px;color:#333;line-height:1.8;max-width:560px;}
  .cert-name{font-family:'Playfair Display',serif;font-style:italic;font-size:30px;color:var(--black);margin:14px 0;display:block;}
  .cert-module{font-weight:700;color:var(--black);}
  .cert-meta{font-size:12px;color:var(--gray);margin-top:18px;}
  .cert-footer{display:flex;justify-content:center;gap:70px;margin-top:44px;width:100%;}
  .sig-block{text-align:center;}
  .sig-block img.firma{height:46px;object-fit:contain;margin-bottom:2px;}
  .sig-placeholder{height:46px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px;border-bottom:1px dashed #ccc;width:170px;}
  .sig-line{border-top:1px solid #999;width:190px;padding-top:6px;font-size:12px;color:#555;}
  .sig-line strong{display:block;color:var(--black);font-size:13px;}
  .seal{position:absolute;bottom:26px;right:40px;width:46px;height:46px;border-radius:10px;opacity:.85;}
  @media print{
    body{background:#fff;padding:0;}
    .toolbar{display:none;}
    .page{box-shadow:none;max-width:none;width:100vw;height:100vh;aspect-ratio:auto;}
    @page{size:landscape;margin:0;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">🖨 Imprimir / Guardar como PDF</button>
  <button class="salir" onclick="salirCertificado()">✕ Salir</button>
</div>

<div class="page">
  <div class="cert-border">
    <img class="logo" id="logoImg" src="" alt="MEB Machinery Solutions">
    <div class="cert-title">CERTIFICADO DE CAPACITACIÓN</div>
    <div class="cert-sub">MEB-U — Plataforma de capacitación de MEB Machinery Solutions</div>
    <div class="cert-body">
      Certifico que
      <span class="cert-name" id="nombreOperario">—</span>
      finalizó la capacitación de <span class="cert-module" id="moduloTitulo">—</span> con éxito.
      <div class="cert-meta" id="metaInfo"></div>
    </div>
    <div class="cert-footer">
      <div class="sig-block">
        <img class="firma" id="firmaImg" src="" alt="Firma de Marcos Emmanuel Bellando">
        <div class="sig-line"><strong>Marcos Emmanuel Bellando</strong>Instructor — MEB Machinery Solutions</div>
      </div>
    </div>
    <img class="seal" id="seloImg" src="" alt="">
  </div>
</div>

<script>
function salirCertificado() {
  window.close();
  setTimeout(() => { window.location.href = 'mebu.html'; }, 300);
}

function qp(name) {
  return new URLSearchParams(window.location.search).get(name) || '';
}

function capitalizarNombre(str) {
  return str.trim().toLowerCase().split(/\s+/).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
}

document.getElementById('nombreOperario').textContent = qp('nombre') ? capitalizarNombre(qp('nombre')) : 'Nombre del operario';
document.getElementById('moduloTitulo').textContent = qp('modulo') || 'Módulo';

const fecha = qp('fecha');
const puntaje = qp('puntaje');
let meta = [];
if (fecha) meta.push('Fecha: ' + fecha);
if (puntaje) meta.push('Puntaje: ' + puntaje + '%');
document.getElementById('metaInfo').textContent = meta.join('  ·  ');

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0d">
<title>MEB · Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --y:#F4B400; --bg:#0d0d0d; --panel:#141414; --card:#1c1c1c;
  --border:#272727; --text:#e0e0e0; --muted:#666; --muted2:#3a3a3a;
  --green:#2ecc71; --red:#e74c3c; --orange:#e67e22; --blue:#003B70; --blue-l:#7bb3e0;
  --nav-h:62px; --top-h:52px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;height:100%;overflow:hidden}
::-webkit-scrollbar{display:none}

/* ── TOPBAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--top-h);
  background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:100;
}
.topbar-logo{display:flex;align-items:center;gap:8px}
.logo-sq{background:var(--y);width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center}
.logo-sq span{font-family:'Bebas Neue';font-size:13px;color:#000;letter-spacing:1px}
.logo-name{font-family:'Bebas Neue';font-size:16px;color:var(--y);letter-spacing:3px}
.topbar-right{display:flex;align-items:center;gap:10px}
.sync-pill{background:var(--blue);color:var(--blue-l);border:none;padding:5px 11px;border-radius:20px;font-family:'Bebas Neue';font-size:11px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:4px}
.sync-pill.loading{opacity:.5}
.dot-status{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot-status.err{background:var(--red)}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:var(--panel);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);z-index:100;
}
.nav-tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;padding:6px 0;color:var(--muted);
  font-size:10px;letter-spacing:.5px;text-transform:uppercase;
  font-family:'Barlow';font-weight:600;transition:color .15s;
  position:relative;
}
.nav-tab.active{color:var(--y)}
.nav-tab.active::before{
  content:'';position:absolute;top:0;left:20%;right:20%;height:2px;
  background:var(--y);border-radius:0 0 2px 2px;
}
.nav-icon{font-size:20px;line-height:1}
.nav-badge{
  position:absolute;top:6px;right:calc(50% - 18px);
  background:var(--red);color:#fff;font-size:9px;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;
}

/* ── SCROLL AREA ── */
.scroll-area{
  position:fixed;top:var(--top-h);bottom:var(--nav-h);left:0;right:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}

/* ── PAGES ── */
.page{display:none;padding:14px 14px 8px}
.page.active{display:block}

/* ── LOGIN ── */
.login-wrap{
  position:fixed;inset:0;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;z-index:999;
}
.login-logo-big{text-align:center;margin-bottom:32px}
.login-logo-big .sq{background:var(--y);width:56px;height:56px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.login-logo-big .sq span{font-family:'Bebas Neue';font-size:26px;color:#000}
.login-logo-big h1{font-family:'Bebas Neue';font-size:22px;color:var(--y);letter-spacing:4px}
.login-logo-big p{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.login-box{width:100%;max-width:340px}
.login-box input{
  width:100%;background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:13px 14px;border-radius:6px;
  font-family:'Barlow';font-size:15px;outline:none;margin-bottom:10px;
}
.login-box input:focus{border-color:var(--y)}
.login-btn{
  width:100%;background:var(--y);color:#000;border:none;padding:14px;
  font-family:'Bebas Neue';font-size:17px;letter-spacing:2px;
  border-radius:6px;cursor:pointer;margin-top:4px;
}
.login-err{color:var(--red);font-size:12px;text-align:center;margin-top:8px;display:none}

/* ── SECTION TITLE ── */
.sec-title{
  font-family:'Bebas Neue';font-size:13px;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;margin:18px 0 8px;
  padding-bottom:5px;border-bottom:1px solid var(--border);
}
.sec-title:first-child{margin-top:0}

/* ── HERO (dashboard) ── */
.hero{
  background:var(--card);border:1px solid var(--border);
  border-left:4px solid var(--red);border-radius:8px;
  padding:18px 16px;margin-bottom:14px;
}
.hero-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.hero-amount{font-family:'Bebas Neue';font-size:44px;color:var(--y);letter-spacing:2px;line-height:1}
.hero-sub{font-size:12px;color:var(--muted);margin-top:5px}

/* ── PILLS ROW ── */
.pills-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.pill{
  flex-shrink:0;background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:7px 13px;
  display:flex;align-items:center;gap:6px;
}
.pill-val{font-family:'Bebas Neue';font-size:18px;color:var(--text);letter-spacing:1px}
.pill-lbl{font-size:10px;color:var(--muted);letter-spacing:.5px;line-height:1.3}
.pill.green .pill-val{color:var(--green)}
.pill.red .pill-val{color:var(--red)}
.pill.orange .pill-val{color:var(--orange)}
.pill.yellow .pill-val{color:var(--y)}

/* ── WORK CARD ── */
.work-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:7px;padding:13px 14px;margin-bottom:8px;
  border-left:3px solid var(--border);
}
.work-card.cobro-pendiente{border-left-color:var(--red)}
.work-card.cobro-parcial{border-left-color:var(--orange)}
.work-card.cobro-cobrado{border-left-color:var(--green)}
.work-card.estado-en-curso{border-left-color:var(--y)}

.wc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.wc-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;flex:1}
.wc-monto{font-family:'Bebas Neue';font-size:16px;color:var(--y);letter-spacing:1px;white-space:nowrap}
.wc-meta{font-size:11px;color:var(--muted);margin-bottom:7px}
.wc-bottom{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;white-space:nowrap}
.bg-green{background:rgba(46,204,113,.12);color:var(--green)}
.bg-red{background:rgba(231,76,60,.12);color:var(--red)}
.bg-orange{background:rgba(230,126,34,.12);color:var(--orange)}
.bg-yellow{background:rgba(244,180,0,.12);color:var(--y)}
.bg-blue{background:rgba(0,59,112,.3);color:var(--blue-l)}
.bg-gray{background:rgba(100,100,100,.15);color:var(--muted)}

/* ── COBRO BADGE ── */
.cobro-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cobro-dot.pendiente{background:var(--red)}
.cobro-dot.parcial{background:var(--orange)}
.cobro-dot.cobrado{background:var(--green)}
.cobro-label{font-size:11px;font-weight:600}
.cobro-label.pendiente{color:var(--red)}
.cobro-label.parcial{color:var(--orange)}
.cobro-label.cobrado{color:var(--green)}

/* ── CLIENTE CARD ── */
.cli-card{
  background:var(--card);border:1px solid var(--border);border-radius:7px;
  padding:13px 14px;margin-bottom:8px;
}
.cli-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.cli-empresa{font-size:12px;color:var(--muted);margin-bottom:8px}
.cli-row{display:flex;justify-content:space-between;align-items:center}
.cli-zona{font-size:12px;color:var(--muted)}
.wa-btn{
  background:rgba(37,211,102,.15);color:#25d366;
  border:1px solid rgba(37,211,102,.3);border-radius:20px;
  padding:6px 12px;font-size:12px;font-weight:700;
  text-decoration:none;display:inline-flex;align-items:center;gap:5px;
}
.wa-btn:active{background:rgba(37,211,102,.25)}
.cli-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.cli-detail.open{display:block}
.cli-detail-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.cli-detail-key{color:var(--muted)}
.cli-detail-val{color:var(--text);font-weight:600;text-align:right}
.maq-chip{display:inline-flex;align-items:center;gap:4px;background:var(--muted2);border-radius:3px;padding:3px 8px;font-size:11px;color:var(--text);margin:2px 2px 0 0}

/* ── ALERTA CARD ── */
.al-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:7px;padding:13px 14px;margin-bottom:8px;
  display:flex;gap:12px;align-items:flex-start;
}
.al-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.al-dot.vencido{background:var(--red)}
.al-dot.urgente{background:var(--orange)}
.al-dot.proximo{background:var(--y)}
.al-body{flex:1}
.al-titulo{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.al-sub{font-size:11px;color:var(--muted);margin-bottom:5px}
.al-tiempo{font-family:'Bebas Neue';font-size:13px;letter-spacing:1px}
.al-tiempo.vencido{color:var(--red)}
.al-tiempo.urgente{color:var(--orange)}
.al-tiempo.proximo{color:var(--y)}

/* ── FILTER TABS ── */
.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.ftab{
  flex-shrink:0;background:transparent;border:1px solid var(--border);
  color:var(--muted);border-radius:20px;padding:5px 12px;
  font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;
}
.ftab.active{background:var(--y);color:#000;border-color:var(--y)}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.2}
.empty-txt{font-size:13px;letter-spacing:1px}

/* ── PRESUP CARD ── */
.presup-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:7px;padding:13px 14px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
}
.presup-body{flex:1}
.presup-num{font-family:'Bebas Neue';font-size:13px;color:var(--y);letter-spacing:1px}
.presup-cli{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.presup-desc{font-size:12px;color:var(--muted);margin-bottom:6px}
.presup-right{text-align:right;flex-shrink:0}
.presup-monto{font-family:'Bebas Neue';font-size:18px;color:var(--y);letter-spacing:1px}
.presup-fecha{font-size:11px;color:var(--muted);margin-top:3px}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:calc(var(--nav-h) + 12px);left:14px;right:14px;
  background:var(--card);border:1px solid var(--border);
  border-left:3px solid var(--y);border-radius:6px;
  padding:11px 14px;font-size:13px;color:var(--text);
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;
}
.toast.show{opacity:1}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}

/* ── LOADING ── */
.loading-scr{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;z-index:500;
}
.loading-scr.open{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--y);border-radius:50%;animation:spin .7s linear infinite}
.loading-txt{font-family:'Bebas Neue';font-size:14px;color:var(--y);letter-spacing:3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── PRESUPUESTOS tab badge ── */
.tab-count{font-size:9px;color:var(--muted);font-family:'Barlow';text-transform:none;letter-spacing:0}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-scr" id="ls"><div class="spinner"></div><div class="loading-txt" id="lt">CARGANDO</div></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-logo-big">
    <div class="sq"><span>MEB</span></div>
    <h1>MACHINERY SOLUTIONS</h1>
    <p>Panel de campo</p>
  </div>
  <div class="login-box">
    <input type="text" id="lu" placeholder="Usuario" autocomplete="username"/>
    <input type="password" id="lp" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">INGRESAR</button>
    <div class="login-err" id="lerr">Usuario o contraseña incorrectos</div>
  </div>
</div>

<!-- APP SHELL (hidden until login) -->
<div id="appShell" style="display:none">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo">
      <div class="logo-sq"><span>MEB</span></div>
      <span class="logo-name">MEB</span>
    </div>
    <div class="topbar-right">
      <div class="dot-status" id="dotStatus"></div>
      <button class="sync-pill" id="syncBtn" onclick="syncData()">↺ SYNC</button>
    </div>
  </div>

  <!-- SCROLL AREA -->
  <div class="scroll-area" id="scrollArea">

    <!-- INICIO -->
    <div class="page active" id="pg-inicio">
      <div class="hero" id="hero-cobrar">
        <div class="hero-label">💳 Por cobrar</div>
        <div class="hero-amount" id="hero-monto">$0</div>
        <div class="hero-sub" id="hero-sub">— trabajos completados sin cobrar</div>
      </div>
      <div class="pills-row" id="pills-row"></div>
      <div class="sec-title">EN CURSO</div>
      <div id="inicio-trabajos"></div>
      <div class="sec-title">PRÓXIMOS COBROS</div>
      <div id="inicio-cobros"></div>
    </div>

    <!-- TRABAJOS -->
    <div class="page" id="pg-trabajos">
      <div class="filter-row" id="trab-filters">
        <button class="ftab active" onclick="setTrabFilt('todos',this)">Todos</button>
        <button class="ftab" onclick="setTrabFilt('en curso',this)">En curso</button>
        <button class="ftab" onclick="setTrabFilt('pendiente',this)">Pendientes</button>
        <button class="ftab" onclick="setTrabFilt('completado',this)">Completados</button>
        <button class="ftab" onclick="setTrabFilt('_cobrar',this)">🔴 Por cobrar</button>
      </div>
      <div id="lista-trabajos"></div>
    </div>

    <!-- CLIENTES -->
    <div class="page" id="pg-clientes">
      <div class="filter-row" id="cli-filters">
        <button class="ftab active" onclick="setCliFilt('todos',this)">Todos</button>
        <button class="ftab" onclick="setCliFilt('activo',this)">Activos</button>
        <button class="ftab" onclick="setCliFilt('prospecto',this)">Prospectos</button>
      </div>
      <div id="lista-clientes"></div>
    </div>

    <!-- ALERTAS -->
    <div class="page" id="pg-alertas">
      <div id="lista-alertas"></div>
    </div>

  </div><!-- end scroll-area -->

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="nav-tab active" id="tab-inicio" onclick="goTab('inicio')">
      <div class="nav-icon">🏠</div>
      <span>Inicio</span>
    </div>
    <div class="nav-tab" id="tab-trabajos" onclick="goTab('trabajos')">
      <div class="nav-icon">🔧</div>
      <span>Trabajos</span>
      <div class="nav-badge" id="nb-trabajos" style="display:none"></div>
    </div>
    <div class="nav-tab" id="tab-clientes" onclick="goTab('clientes')">
      <div class="nav-icon">👥</div>
      <span>Clientes</span>
    </div>
    <div class="nav-tab" id="tab-alertas" onclick="goTab('alertas')">
      <div class="nav-icon">🔔</div>
      <span>Alertas</span>
      <div class="nav-badge" id="nb-alertas" style="display:none"></div>
    </div>
  </nav>

</div><!-- end appShell -->

<script>
// ─── CONFIG ───────────────────────────────────────────────
const SHEET_ID = '16SHES6x-MHTy5uj0PtCdkEc8HNh6Hrc3ae-k6eOa8nM';
const USERS   = { meb:'meb2025', admin:'meb2025' };
const CSV_BASE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=`;

// ─── STATE ────────────────────────────────────────────────
let DB = { clientes:[], maquinas:[], trabajos:[], presupuestos:[], alertas:[] };
let trabFilt = 'todos';
let cliFilt  = 'todos';
let currentTab = 'inicio';

// ─── UTILS ────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function fmtMonto(n){ return '$'+Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function fmtDate(d){
  if(!d) return '—';
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(d)) return d;
  const p=d.split('-'); if(p.length===3) return `${p[2]}/${p[1]}/${p[0]}`; return d;
}
function parseMonto(v){
  if(!v) return 0;
  const s=String(v).trim();
  if(s.includes(',')) return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  return parseFloat(s)||0;
}
function toast(msg, type=''){
  const t=$('toast'); t.textContent=msg; t.className='toast '+(type||'');
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800);
}
function showLoad(txt='CARGANDO'){ $('lt').textContent=txt; $('ls').classList.add('open'); }
function hideLoad(){ $('ls').classList.remove('open'); }

function badgeEstado(e){
  const m={activo:'bg-green',prospecto:'bg-blue',inactivo:'bg-gray',
    pendiente:'bg-orange','en curso':'bg-yellow',completado:'bg-green',
    'no aprobado':'bg-red',cancelado:'bg-red',funcionando:'bg-green',parado:'bg-red'};
  return `<span class="badge ${m[e]||'bg-gray'}">${e||'—'}</span>`;
}
function badgeCobro(estado){
  const e=estado||'pendiente';
  const icon={pendiente:'🔴',parcial:'🟡',cobrado:'✅'}[e]||'🔴';
  return `<span class="cobro-dot ${e}"></span><span class="cobro-label ${e}">${icon} ${e}</span>`;
}

// ─── LOGIN ────────────────────────────────────────────────
function doLogin(){
  const u=$('lu').value.trim().toLowerCase().replace(/\s/g,'');
  const p=$('lp').value.trim().replace(/\s/g,'');
  if(USERS[u]===p){
    $('loginWrap').style.display='none';
    $('appShell').style.display='block';
    loadFromLocal();
    syncData();
  } else {
    $('lerr').style.display='block';
  }
}

// ─── LOCAL STORAGE ────────────────────────────────────────
function saveLocal(){ try{ localStorage.setItem('meb_mobile_v1',JSON.stringify(DB)); }catch(e){} }
function loadFromLocal(){
  try{
    const d=localStorage.getItem('meb_mobile_v1');
    if(d){ DB=JSON.parse(d); renderAll(); }
  }catch(e){}
}

// ─── CSV FETCH ────────────────────────────────────────────
async function fetchSheet(name){
  try{
    const r=await fetch(CSV_BASE+encodeURIComponent(name));
    if(!r.ok) throw new Error('error');
    return parseCSV(await r.text());
  }catch(e){ console.warn('fetchSheet',name,e); return []; }
}
function parseCSV(text){
  const lines=text.split('\n').filter(l=>l.trim());
  if(lines.length<2) return [];
  const headers=parseLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,'').trim().toUpperCase().replace(/ /g,'_'));
  return lines.slice(1).map(line=>{
    const vals=parseLine(line);
    const obj={};
    headers.forEach((h,i)=>{ obj[h]=(vals[i]||'').replace(/^"|"$/g,'').trim(); });
    return obj;
  }).filter(r=>Object.values(r).some(v=>v&&v.trim()));
}
function parseLine(line){
  const res=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ inQ=!inQ; }
    else if(c===','&&!inQ){ res.push(cur); cur=''; }
    else { cur+=c; }
  } res.push(cur); return res;
}

// ─── SYNC ─────────────────────────────────────────────────
async function syncData(){
  const btn=$('syncBtn'); const dot=$('dotStatus');
  btn.classList.add('loading'); btn.textContent='↺ ...';
  dot.className='dot-status err';
  showLoad('SINCRONIZANDO');
  try{
    const [cl,mq,tr,pr,al]=await Promise.all([
      fetchSheet('CLIENTES'),fetchSheet('MAQUINAS'),
      fetchSheet('TRABAJOS'),fetchSheet('PRESUPUESTOS'),fetchSheet('ALERTAS')
    ]);
    if(cl.length) DB.clientes=cl.map(r=>({
      id:String(r.ID||'').trim(), nombre:r.NOMBRE||'', empresa:r.EMPRESA||'',
      telefono:r.TELEFONO||'', email:r.EMAIL||'', zona:r.ZONA||'',
      estado:(r.ESTADO||'activo').toLowerCase().trim(),
      ultimoContacto:r.ULTIMO_CONTACTO||''
    }));
    if(mq.length) DB.maquinas=mq.map(r=>({
      id:String(r.ID||'').trim(), clienteId:String(r.CLIENTE_ID||'').trim(),
      marca:r.MARCA||'', modelo:r.MODELO||'', tipo:r.TIPO||'', serie:r.SERIE||''
    }));
    if(tr.length) DB.trabajos=tr.map(r=>({
      id:String(r.ID||'').trim(), clienteId:String(r.CLIENTE_ID||'').trim(),
      maquinaId:String(r.MAQUINA_ID||'').trim(),
      titulo:r.TITULO||r.DESCRIPCION||'', tipo:r.TIPO||'',
      estado:(r.ESTADO||'pendiente').toLowerCase().trim(),
      estadoMaquina:r.ESTADO_MAQUINA||'',
      fechaInicio:r.FECHA_INICIO||'',
      montoCobrado:parseMonto(r.MONTO_COBRADO),
      montoGastos:parseMonto(r.MONTO_GASTOS),
      estadoCobro:(r.ESTADO_COBRO||'pendiente').toLowerCase().trim(),
      notas:r.NOTAS||''
    }));
    if(pr.length) DB.presupuestos=pr.map((r,i)=>({
      id:String(r.ID||'').trim(), num:r.NUMERO||i+1,
      clienteId:String(r.CLIENTE_ID||'').trim(),
      descripcion:r.DESCRIPCION||r.TITULO||'',
      monto:parseMonto(r.MONTO),
      estado:(r.ESTADO||'pendiente').toLowerCase().trim(),
      fecha:r.FECHA||''
    }));
    if(al.length) DB.alertas=al.map(r=>({
      id:String(r.ID||'').trim(), titulo:r.TITULO||'',
      clienteId:String(r.CLIENTE_ID||'').trim(),
      fecha:r.FECHA||'', prioridad:(r.PRIORIDAD||'media').toLowerCase(),
      descripcion:r.DESCRIPCION||'',
      resuelta:r.RESUELTA==='TRUE'||r.RESUELTA==='true'||r.RESUELTA==='1'
    }));
    saveLocal();
    renderAll();
    dot.className='dot-status';
    toast(`${DB.trabajos.length} trabajos · ${DB.clientes.length} clientes`,'ok');
  }catch(e){
    toast('Error al sincronizar','err');
    dot.className='dot-status err';
  }
  hideLoad();
  btn.classList.remove('loading'); btn.textContent='↺ SYNC';
}

// ─── RENDER ALL ───────────────────────────────────────────
function renderAll(){
  renderInicio();
  renderTrabajos();
  renderClientes();
  renderAlertas();
  updateBadges();
}

// ─── BADGES ───────────────────────────────────────────────
function updateBadges(){
  const enCurso=DB.trabajos.filter(t=>t.estado==='en curso').length;
  const nbT=$('nb-trabajos');
  if(enCurso>0){ nbT.textContent=enCurso; nbT.style.display='flex'; }
  else nbT.style.display='none';

  const alActive=DB.alertas.filter(a=>!a.resuelta).length + calcAlertasRepuesto().length;
  const nbA=$('nb-alertas');
  if(alActive>0){ nbA.textContent=alActive; nbA.style.display='flex'; }
  else nbA.style.display='none';
}

// ─── INICIO ───────────────────────────────────────────────
function renderInicio(){
  // Por cobrar
  const porCobrar=DB.trabajos.filter(t=>
    t.estado==='completado'&&(t.estadoCobro||'pendiente')!=='cobrado'&&Number(t.montoCobrado||0)>0
  );
  const montoPorCobrar=porCobrar.reduce((s,t)=>s+Number(t.montoCobrado||0),0);
  $('hero-monto').textContent=fmtMonto(montoPorCobrar);
  $('hero-sub').textContent=`${porCobrar.length} trabajo${porCobrar.length!==1?'s':''} completado${porCobrar.length!==1?'s':''} sin cobrar`;

  // Pills
  const enCurso=DB.trabajos.filter(t=>t.estado==='en curso').length;
  const presupPend=DB.presupuestos.filter(p=>p.estado==='pendiente').length;
  const alertas=DB.alertas.filter(a=>!a.resuelta).length+calcAlertasRepuesto().length;
  $('pills-row').innerHTML=`
    <div class="pill yellow"><div><div class="pill-val">${enCurso}</div><div class="pill-lbl">En<br>curso</div></div></div>
    <div class="pill red"><div><div class="pill-val">${porCobrar.length}</div><div class="pill-lbl">Por<br>cobrar</div></div></div>
    <div class="pill orange"><div><div class="pill-val">${alertas}</div><div class="pill-lbl">Alertas<br>activas</div></div></div>
    <div class="pill"><div><div class="pill-val">${presupPend}</div><div class="pill-lbl">Presup.<br>pend.</div></div></div>
  `;

  // Trabajos en curso
  const curso=DB.trabajos.filter(t=>t.estado==='en curso').slice(0,5);
  $('inicio-trabajos').innerHTML=curso.length
    ? curso.map(t=>workCard(t)).join('')
    : '<div class="empty"><div class="empty-icon">🔧</div><div class="empty-txt">Sin trabajos en curso</div></div>';

  // Próximos cobros (completados sin cobrar)
  $('inicio-cobros').innerHTML=porCobrar.slice(0,5).map(t=>workCard(t)).join('') ||
    '<div class="empty"><div class="empty-icon">✅</div><div class="empty-txt">Todo cobrado</div></div>';
}

// ─── TRABAJOS ─────────────────────────────────────────────
function setTrabFilt(f,el){
  trabFilt=f;
  document.querySelectorAll('#trab-filters .ftab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderTrabajos();
}
function renderTrabajos(){
  let data=DB.trabajos;
  if(trabFilt==='_cobrar'){
    data=data.filter(t=>t.estado==='completado'&&(t.estadoCobro||'pendiente')!=='cobrado');
  } else if(trabFilt!=='todos'){
    data=data.filter(t=>t.estado===trabFilt);
  }
  $('lista-trabajos').innerHTML=data.length
    ? data.map(t=>workCard(t)).join('')
    : '<div class="empty"><div class="empty-icon">🔧</div><div class="empty-txt">Sin trabajos</div></div>';
}

function workCard(t){
  const cl=DB.clientes.find(c=>c.id===t.clienteId);
  const mq=DB.maquinas.find(m=>m.id===t.maquinaId);
  const cobro=t.estadoCobro||'pendiente';
  // clase de borde según cobro para completados, estado para el resto
  const bClass=t.estado==='completado'?`cobro-${cobro}`:`estado-${t.estado.replace(' ','-')}`;
  return `<div class="work-card ${bClass}">
    <div class="wc-top">
      <div class="wc-title">${t.titulo}</div>
      ${Number(t.montoCobrado||0)>0?`<div class="wc-monto">${fmtMonto(t.montoCobrado)}</div>`:''}
    </div>
    <div class="wc-meta">
      ${cl?`<b>${cl.nombre}</b>`:'—'}${mq?` · ${mq.marca} ${mq.modelo}`:''}
      ${t.fechaInicio?` · ${fmtDate(t.fechaInicio)}`:''}
    </div>
    <div class="wc-bottom">
      ${badgeEstado(t.estado)}
      ${t.estadoMaquina?badgeEstado(t.estadoMaquina.toLowerCase()):''}
      <div style="display:flex;align-items:center;gap:4px">${badgeCobro(cobro)}</div>
    </div>
  </div>`;
}

// ─── CLIENTES ─────────────────────────────────────────────
function setCliFilt(f,el){
  cliFilt=f;
  document.querySelectorAll('#cli-filters .ftab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderClientes();
}
function renderClientes(){
  let data=DB.clientes;
  if(cliFilt!=='todos') data=data.filter(c=>c.estado===cliFilt);
  $('lista-clientes').innerHTML=data.length
    ? data.map(c=>clienteCard(c)).join('')
    : '<div class="empty"><div class="empty-icon">👥</div><div class="empty-txt">Sin clientes</div></div>';
}

function clienteCard(c){
  const mqs=DB.maquinas.filter(m=>m.clienteId===c.id);
  const trs=DB.trabajos.filter(t=>t.clienteId===c.id);
  const total=trs.reduce((s,t)=>s+Number(t.montoCobrado||0),0);
  const waNum=c.telefono.replace(/\D/g,'');
  const waLink=waNum?`<a class="wa-btn" href="https://wa.me/${waNum}" target="_blank">💬 WhatsApp</a>`:'';
  const maqChips=mqs.map(m=>`<span class="maq-chip">⚙️ ${m.marca} ${m.modelo}</span>`).join('');
  return `<div class="cli-card">
    <div class="cli-name">${c.nombre}</div>
    ${c.empresa&&c.empresa!==c.nombre?`<div class="cli-empresa">${c.empresa}</div>`:''}
    <div class="cli-row">
      <span class="cli-zona">📍 ${c.zona||'—'} · ${badgeEstado(c.estado)}</span>
      ${waLink}
    </div>
    <div class="cli-detail" id="cd-${c.id}">
      <div class="cli-detail-row">
        <span class="cli-detail-key">Teléfono</span>
        <span class="cli-detail-val">${c.telefono||'—'}</span>
      </div>
      <div class="cli-detail-row">
        <span class="cli-detail-key">Total facturado</span>
        <span class="cli-detail-val" style="color:var(--y);font-family:'Bebas Neue';font-size:15px">${fmtMonto(total)}</span>
      </div>
      <div class="cli-detail-row">
        <span class="cli-detail-key">Trabajos</span>
        <span class="cli-detail-val">${trs.length} (${trs.filter(t=>t.estado==='completado').length} completados)</span>
      </div>
      ${maqChips?`<div style="margin-top:6px">${maqChips}</div>`:''}
    </div>
    <div style="text-align:center;margin-top:10px">
      <button onclick="toggleDetalle('${c.id}')" style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;letter-spacing:1px" id="cd-btn-${c.id}">▼ VER DETALLE</button>
    </div>
  </div>`;
}

function toggleDetalle(id){
  const el=$(`cd-${id}`);
  const btn=$(`cd-btn-${id}`);
  if(el.classList.contains('open')){
    el.classList.remove('open'); btn.textContent='▼ VER DETALLE';
  } else {
    el.classList.add('open'); btn.textContent='▲ CERRAR';
  }
}

// ─── ALERTAS ──────────────────────────────────────────────
const REPUESTO_HS={
  'filtro de aceite':250,'filtro aceite':250,'aceite':500,'aceite hy-gard':500,
  'filtro hidráulico':500,'filtro hidraulico':500,'filtro de combustible':500,
  'filtro combustible':500,'filtro de aire':500,'filtro aire':500,
  'filtro transmisión':1000,'filtro transmision':1000,
  'sellos':2000,'sello':2000,'correa':1000,'buje':2000,'bujes':2000,
  'inyector':3000,'inyectores':3000,'bomba':3000,'cilindro':2000,
  'service':500,'service 250hs':250,'service 500hs':500,
  'service 1000hs':1000,'service 2000hs':2000,'service 3000hs':3000
};
function calcAlertasRepuesto(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const en30=new Date(hoy.getTime()+30*864e5);
  const en60=new Date(hoy.getTime()+60*864e5);
  const res=[];
  DB.trabajos.forEach(t=>{
    if(!t.fechaInicio||!t.titulo) return;
    const key=Object.keys(REPUESTO_HS).find(k=>t.titulo.toLowerCase().includes(k));
    if(!key) return;
    const hs=REPUESTO_HS[key];
    let fecha=null;
    if(/^\d{2}\/\d{2}\/\d{4}$/.test(t.fechaInicio)){
      const [d,m,y]=t.fechaInicio.split('/'); fecha=new Date(y,m-1,d);
    } else if(/^\d{4}-\d{2}-\d{2}$/.test(t.fechaInicio)){
      const [y,m,d]=t.fechaInicio.split('-'); fecha=new Date(y,m-1,d);
    }
    if(!fecha) return;
    const dias=Math.ceil(hs/8*(7/5));
    const prox=new Date(fecha.getTime()+dias*864e5);
    const dr=Math.ceil((prox-hoy)/864e5);
    let urgencia=null;
    if(prox<=hoy) urgencia='vencido';
    else if(prox<=en30) urgencia='urgente';
    else if(prox<=en60) urgencia='proximo';
    if(urgencia){
      const cl=DB.clientes.find(c=>c.id===t.clienteId);
      const mq=DB.maquinas.find(m=>m.id===t.maquinaId);
      res.push({
        clienteNombre:cl?.nombre||'—',
        maquinaDesc:mq?`${mq.marca} ${mq.modelo}`:'—',
        label:key.charAt(0).toUpperCase()+key.slice(1),
        hs, diasRestantes:dr, urgencia, fechaBase:t.fechaInicio
      });
    }
  });
  return res.sort((a,b)=>a.diasRestantes-b.diasRestantes);
}

function renderAlertas(){
  const alMant=calcAlertasRepuesto();
  const alManuales=DB.alertas.filter(a=>!a.resuelta).sort((a,b)=>{
    const p={alta:0,media:1,baja:2}; return (p[a.prioridad]||1)-(p[b.prioridad]||1);
  });
  if(!alMant.length&&!alManuales.length){
    $('lista-alertas').innerHTML='<div class="empty"><div class="empty-icon">✅</div><div class="empty-txt">Sin alertas activas</div></div>';
    return;
  }
  let html='';
  // Mantenimiento
  if(alMant.length){
    html+=`<div class="sec-title">⚙️ MANTENIMIENTO (${alMant.length})</div>`;
    html+=alMant.map(a=>{
      const tiempoLabel=a.urgencia==='vencido'
        ?`VENCIDO hace ${Math.abs(a.diasRestantes)}d`
        :`en ${a.diasRestantes} días`;
      return `<div class="al-card">
        <div class="al-dot ${a.urgencia}"></div>
        <div class="al-body">
          <div class="al-titulo">${a.clienteNombre}</div>
          <div class="al-sub">${a.maquinaDesc} · ${a.label} (cada ${a.hs}hs)</div>
          <div class="al-sub">Base: ${a.fechaBase}</div>
          <div class="al-tiempo ${a.urgencia}">${tiempoLabel}</div>
        </div>
      </div>`;
    }).join('');
  }
  // Manuales
  if(alManuales.length){
    html+=`<div class="sec-title">🔔 ALERTAS (${alManuales.length})</div>`;
    html+=alManuales.map(a=>{
      const col=a.prioridad==='alta'?'vencido':a.prioridad==='media'?'urgente':'proximo';
      const cl=DB.clientes.find(c=>c.id===a.clienteId);
      return `<div class="al-card">
        <div class="al-dot ${col}"></div>
        <div class="al-body">
          <div class="al-titulo">${a.titulo}</div>
          ${cl?`<div class="al-sub">${cl.nombre}</div>`:''}
          ${a.descripcion?`<div class="al-sub">${a.descripcion}</div>`:''}
          <div class="al-tiempo ${col}">${fmtDate(a.fecha)}</div>
        </div>
      </div>`;
    }).join('');
  }
  $('lista-alertas').innerHTML=html;
}

// ─── TABS ─────────────────────────────────────────────────
function goTab(name){
  currentTab=name;
  // pages
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(`pg-${name}`).classList.add('active');
  // tabs
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  $(`tab-${name}`).classList.add('active');
  // scroll to top
  $('scrollArea').scrollTop=0;
}

<style>
:root{
  --fondo:#070B26; --fondo2:#140F3D; --panel:rgba(22,28,82,.58); --panel2:rgba(36,30,96,.55);
  --borde:rgba(226,190,110,.28); --oro:#E2BE6E; --oro2:#F6DE9C; --oro-osc:#A9843C;
  --texto:#ECE9FF; --suave:#B8B5DD; --violeta:#8B78F0; --azul:#4F7BEA; --bien:#7FD6A4; --mal:#F08A8A;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.55 'Nunito Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#cielo{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebulosa{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 40% at 15% 10%,rgba(79,123,234,.30),transparent 70%),
  radial-gradient(55% 45% at 90% 35%,rgba(139,120,240,.28),transparent 70%),
  radial-gradient(70% 50% at 40% 100%,rgba(48,38,140,.45),transparent 70%),
  linear-gradient(180deg,#060A24 0%,#0C1240 45%,#1A1250 100%)}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px}
header{position:relative;z-index:1;text-align:center;padding:calc(26px + env(safe-area-inset-top)) 16px 6px}
.simbolo{width:96px;height:96px;margin:0 auto 8px;filter:drop-shadow(0 0 14px rgba(226,190,110,.45))}
.simbolo .rueda{transform-origin:50% 50%;animation:girar 40s linear infinite}
.simbolo .orbita{transform-origin:50% 50%;animation:girar 9s linear infinite reverse}
@keyframes girar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.simbolo .rueda,.simbolo .orbita{animation:none}}
h1{font:700 30px/1.1 'Cinzel',serif;letter-spacing:.12em;color:var(--oro2);text-shadow:0 0 18px rgba(226,190,110,.35)}
.sub{color:var(--suave);font-size:14px;margin-top:4px}
h2{font:700 19px/1.25 'Cinzel',serif;color:var(--oro2);letter-spacing:.06em;margin:26px 0 10px;text-align:center}
h3{font:700 16px/1.3 'Cinzel',serif;color:var(--oro);letter-spacing:.05em;margin:22px 0 10px}
h4{font-weight:700;font-size:16px;color:var(--texto)}
.caja{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-bottom:12px}
.caja p+p{margin-top:8px}
.oro{color:var(--oro2)}
.chico,.ag-ayuda{font-size:13px;color:var(--suave)}
.ag-ayuda{margin-top:10px}
.afirm{font:italic 500 21px/1.35 'Cormorant Garamond',serif;color:var(--oro2);text-align:center;margin:14px 6px 4px}
.btn{text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px 'Nunito Sans',sans-serif;color:#1A1232;background:linear-gradient(180deg,var(--oro2),var(--oro));border:0;border-radius:999px;padding:12px 20px;cursor:pointer;min-height:46px;box-shadow:0 4px 18px rgba(226,190,110,.25)}
.btn.sec{background:transparent;color:var(--oro2);border:1px solid var(--borde);box-shadow:none}
.btn.ancho{width:100%}
.btn:active{transform:scale(.98)}
.fila-btn{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fila-btn .btn{flex:1 1 140px;font-size:14px;padding:10px 14px}
input[type=text]{width:100%;background:rgba(10,14,50,.6);color:var(--texto);border:1px solid var(--borde);border-radius:12px;padding:11px 12px;font:15px 'Nunito Sans',sans-serif}
input[type=text]:focus{outline:2px solid var(--oro);outline-offset:1px}
:focus-visible{outline:2px solid var(--oro2);outline-offset:2px}

/* navegación */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,11,40,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--borde);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:130px;background:none;border:0;color:var(--suave);font:600 12px 'Nunito Sans',sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;cursor:pointer;min-height:52px}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button[aria-selected=true]{color:var(--oro2);background:rgba(226,190,110,.10)}

/* cartas */
.carta{width:132px;aspect-ratio:3/5;flex:none;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45))}
.carta svg{width:100%;height:100%;display:block}
.cwrap{position:relative;width:100%;height:100%}
.cwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:9px;border:2px solid var(--oro);background:#16206A}
.hero{display:flex;gap:16px;align-items:center}
.hero .txt small{color:var(--suave);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.hero .txt h4{font:700 21px/1.2 'Cinzel',serif;color:var(--oro2);margin:2px 0 6px}
.constel{position:absolute;opacity:.55;pointer-events:none}
.hoy-carta-wrap{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-size:13px}
.punto{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.4)}
.datos{list-style:none;margin-top:12px;display:grid;gap:10px}
.datos li{display:flex;gap:10px;align-items:flex-start}
.datos li b.ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(226,190,110,.12);color:var(--oro2);font-size:15px}
.datos li .punto{display:inline-block;vertical-align:-1px;margin-right:2px}
.datos li span:not(.punto){display:block;font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}

/* tres cartas */
.tres{display:flex;gap:10px;justify-content:center;perspective:900px;margin-top:6px}
.tres button{background:none;border:0;padding:0;cursor:pointer;width:30%;max-width:120px;aspect-ratio:3/5;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.tres button .cara,.tres button .dorso{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tres button .cara{transform:rotateY(180deg)}
.tres button.vuelta{transform:rotateY(180deg)}
.tres button.apagada{opacity:.35}
.tres button:not([disabled]):hover{transform:translateY(-4px)}
.tres svg{width:100%;height:100%}

/* arcanos personales */
.arc{display:flex;gap:14px;align-items:flex-start}
.arc .carta{width:92px}
.arc small{color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.arc h4{font:700 18px 'Cinzel',serif;color:var(--oro2);margin:2px 0 4px}
.vermas{background:none;border:0;color:var(--oro);font:700 14px 'Nunito Sans',sans-serif;cursor:pointer;padding:8px 0 0;display:inline-flex;gap:6px;align-items:center}
.expande{display:none;margin-top:12px;border-top:1px solid var(--borde);padding-top:12px;font-size:15px}
.expande.abierto{display:block}
.expande ul{margin:6px 0 0 18px}
.expande ul li{margin-bottom:4px}
.expande .et{color:var(--oro);font-weight:700}

/* numerología */
.num-grande{display:flex;gap:14px;align-items:center}
.num-grande b,.num-lista b{font:700 30px/1 'Cinzel',serif;color:var(--oro2);min-width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--borde);background:radial-gradient(circle,rgba(226,190,110,.18),transparent 70%);flex:none}
.num-lista{list-style:none;display:grid;gap:12px;margin-top:14px}
.num-lista li{display:flex;gap:12px;align-items:center}
.num-lista b{font-size:20px;min-width:44px;height:44px}
.num-lista span{display:block;font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}
.nombre-item+.nombre-item{margin-top:12px}
.nombre-item h4{font:700 17px 'Cinzel',serif;color:var(--oro2)}

/* carta natal */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.trio>div{text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 4px}
.trio .gl{font-size:26px;background:none;border:0;padding:0;color:var(--oro2);line-height:1.2}
.trio small{display:block;color:var(--suave);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.trio strong{font-size:14px}
.planetas{list-style:none;margin-top:10px;font-size:14px}
.planetas li{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.planetas li:last-child{border:0}
.planetas b{color:var(--oro2)}

/* agenda */
.luna-caja{display:flex;gap:14px;align-items:center}
.luna-dibujo{width:64px;height:64px;border-radius:50%;flex:none;background:#1a1f52;box-shadow:inset -18px 0 0 0 #E8E2C4,0 0 18px rgba(232,226,196,.25)}
.luna-dibujo.llena{background:#EFE7C8;box-shadow:0 0 26px rgba(239,231,200,.55)}
.luna-dibujo.nueva{background:#141842;box-shadow:inset 0 0 0 1px rgba(232,226,196,.35)}
.filtros{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin:0 -2px}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--texto);border-radius:999px;padding:7px 13px;font:600 13px 'Nunito Sans',sans-serif;cursor:pointer}
.filtros button[aria-pressed=true]{background:var(--oro);color:#1A1232;border-color:var(--oro)}
.ag-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ag-cab h4{font:700 17px 'Cinzel',serif;color:var(--oro2);text-transform:capitalize}
.ag-cab button{background:rgba(255,255,255,.07);border:1px solid var(--borde);color:var(--oro2);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.ag-cab button:disabled{opacity:.3}
.grilla{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grilla .dn{text-align:center;font-size:11px;color:var(--suave);padding-bottom:2px}
.grilla button{aspect-ratio:1;background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:10px;color:var(--texto);font:600 14px 'Nunito Sans',sans-serif;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.grilla button .mk{font-size:11px;line-height:1;color:var(--oro2);min-height:11px}
.grilla button.hoy{border-color:var(--oro)}
.grilla button.sel{background:rgba(226,190,110,.22);border-color:var(--oro2)}
.grilla button.bueno::after,.grilla button.evitar::after{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%}
.grilla button.bueno::after{background:var(--bien)}
.grilla button.evitar::after{background:var(--mal)}
.leyenda{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--suave);margin-top:10px}
.det{margin-top:14px}
.det h4.dia{font:700 18px 'Cinzel',serif;color:var(--oro2)}
.det h4.dia::first-letter{text-transform:uppercase}
.rec{list-style:none;margin-top:10px;display:grid;gap:8px}
.rec li{background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;border-left:3px solid var(--suave);font-size:14.5px}
.rec li.bueno{border-left-color:var(--bien)}
.rec li.evitar{border-left-color:var(--mal)}
.rec li b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--oro)}
.evento{background:rgba(139,120,240,.14);border:1px solid rgba(139,120,240,.35);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.ritual{margin-top:12px;background:linear-gradient(160deg,rgba(226,190,110,.12),rgba(139,120,240,.10));border:1px solid var(--borde);border-radius:14px;padding:14px}
.ritual h5{font:700 15px 'Cinzel',serif;color:var(--oro2);margin-bottom:6px}
.ritual ol,.ritual ul{margin:6px 0 0 20px;font-size:14.5px}
.ritual .seg{font-size:12.5px;color:var(--suave);margin-top:8px}

/* MEB */
.cruce{list-style:none;display:grid;gap:10px;margin-top:8px}
.cruce li{background:rgba(255,255,255,.04);border-radius:12px;padding:11px 12px;font-size:15px;border-left:3px solid var(--oro)}
.pendiente{border:1px dashed var(--borde);border-radius:14px;padding:14px;color:var(--suave);font-size:14.5px;text-align:center}

/* instalar y modal */
.instalar{text-align:center}
.instalar h4{font:700 17px 'Cinzel',serif;color:var(--oro2);margin-bottom:6px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,5,20,.75);display:none;align-items:flex-end;justify-content:center;padding:16px}
.modal.abierto{display:flex}
.modal .caja{max-width:480px;width:100%;margin-bottom:calc(10px + env(safe-area-inset-bottom));background:#121752}
.modal ol{margin:10px 0 0 20px;display:grid;gap:8px}
.oculto{display:none!important}
.pie{text-align:center;font-size:12px;color:var(--suave);margin:28px 0 10px}
.vista{animation:aparecer .35s ease}
@keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:380px){.carta{width:112px}.hero{gap:12px}.arc .carta{width:78px}}
</style>
</head>

'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- símbolo: rueda dentada dorada ---------- */
(function rueda(){
  const g = document.getElementById('rueda'); let d = '';
  const N = 16, R1 = 44, R2 = 50, cx = 60, cy = 60;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2, w = Math.PI / N * .55;
    const p = (r, t) => (cx + r * Math.cos(t)).toFixed(2) + ' ' + (cy + r * Math.sin(t)).toFixed(2);
    d += (i ? 'L' : 'M') + p(R1, a - w * 1.4) + 'L' + p(R2, a - w) + 'L' + p(R2, a + w) + 'L' + p(R1, a + w * 1.4);
    d += 'A' + R1 + ' ' + R1 + ' 0 0 1 ' + p(R1, a + Math.PI * 2 / N - w * 1.4);
  }
  g.innerHTML = `<path d="${d}Z" fill="none" stroke="url(#go)" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="38" fill="none" stroke="url(#go)" stroke-width="1" stroke-dasharray="2 4"/>
    ${[0,90,180,270].map(r => `<path transform="rotate(${r} 60 60)" d="M60 4l2 6h-4z" fill="#F8E3A6"/>`).join('')}`;
})();

/* ---------- cielo azul estrellado ---------- */
(function cielo(){
  const c = document.getElementById('cielo'), x = c.getContext('2d');
  let W, H, est = [], fugaz = null; const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tam(){ const dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px'; x.setTransform(dpr,0,0,dpr,0,0);
    est = Array.from({length: Math.round(W * H / 2600)}, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .2, f: Math.random() * 6.28, v: .4 + Math.random() * 1.6, o: Math.random() < .12 })); }
  function dibujar(t){
    x.clearRect(0,0,W,H);
    for (const s of est) {
      const a = .35 + .65 * Math.abs(Math.sin(s.f + t / 1000 * s.v * (quieto ? 0 : 1)));
      x.globalAlpha = a; x.fillStyle = s.o ? '#F6DE9C' : '#DDE4FF';
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fill();
      if (s.r > 1.2) { x.globalAlpha = a * .35; x.fillRect(s.x - s.r * 3, s.y - .3, s.r * 6, .6); x.fillRect(s.x - .3, s.y - s.r * 3, .6, s.r * 6); }
    }
    if (!quieto) {
      if (!fugaz && Math.random() < .002) fugaz = { x: Math.random() * W * .7 + W * .3, y: Math.random() * H * .4, l: 0 };
      if (fugaz) { fugaz.l += 1; const k = fugaz.l * 9; x.globalAlpha = Math.max(0, 1 - fugaz.l / 40); x.strokeStyle = '#F6DE9C'; x.lineWidth = 1.4;
        x.beginPath(); x.moveTo(fugaz.x - k, fugaz.y + k * .5); x.lineTo(fugaz.x - k + 60, fugaz.y + k * .5 - 30); x.stroke(); if (fugaz.l > 40) fugaz = null; }
    }
    x.globalAlpha = 1;
    if (!quieto) requestAnimationFrame(dibujar);
  }

/* ---------- numerología ---------- */
const sumaDig = s => String(s).replace(/\D/g,'').split('').reduce((a, b) => a + +b, 0);
function reducir(n, maestros = true){ while (n > 9 && !(maestros && (n === 11 || n === 22 || n === 33))) n = sumaDig(n); return n; }
function arcano(n){ while (n > 22) n = sumaDig(n); return n === 22 ? 0 : n; }
const fechaDig = (d, m, y) => sumaDig(String(d).padStart(2,'0') + String(m).padStart(2,'0') + y);
const LETRA = {A:1,J:1,S:1,B:2,K:2,T:2,C:3,L:3,U:3,D:4,M:4,V:4,E:5,N:5,W:5,F:6,O:6,X:6,G:7,P:7,Y:7,H:8,Q:8,Z:8,I:9,R:9};
function numNombre(nombre){
  const t = nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/Ñ/g,'N');
  let tot = 0, voc = 0;
  for (const ch of t) if (LETRA[ch]) { tot += LETRA[ch]; if ('AEIOU'.includes(ch)) voc += LETRA[ch]; }
  return { expresion: reducir(tot), alma: reducir(voc), personalidad: reducir(tot - voc), crudo: tot };
}

};
const NUM = {

  anio: y => reducir(fechaDig(ND, NM, y), false),
  mes: d => reducir(reducir(fechaDig(ND, NM, d.getFullYear()), false) + d.getMonth() + 1, false),

/* ---------- efemérides ---------- */
const D0 = deISO(EFEM.d0);
function lunaDe(d){
  const i = Math.round((d - D0) / 864e5), x = EFEM.dias[i];
  if (!x) return null;
  const [s, p, crece] = x;
  const fase = p <= 3 ? 'nueva' : p >= 97 ? 'llena' : crece ? 'creciente' : 'menguante';
  return { signo: s, ilum: p, crece: !!crece, fase };
}
const LUN = EFEM.lun.map(([f, t, s, e]) => ({ f: new Date(f + ':00-03:00'), t, s, e }));
const RET = EFEM.ret.map(([p, a, b, s1, s2]) => ({ p, ini: new Date(a + ':00-03:00'), fin: b ? new Date(b + ':00-03:00') : null, s1, s2 }));
const ING = EFEM.ing.map(([f, s]) => ({ f: new Date(f + ':00-03:00'), s }));
const retroActivos = d => { const t = new Date(d); t.setHours(12); return RET.filter(r => r.ini <= t && (!r.fin || t < r.fin)); };
const eventosDia = d => ({
  lun: LUN.filter(l => mismoDia(l.f, d)),
  retIni: RET.filter(r => mismoDia(r.ini, d)), retFin: RET.filter(r => r.fin && mismoDia(r.fin, d)),
  ing: ING.filter(i => mismoDia(i.f, d)),
});
const hora = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
const LUN_N = { nueva:'Luna nueva', llena:'Luna llena', creciente:'Cuarto creciente', menguante:'Cuarto menguante' };
const LUN_IC = { nueva:'●', llena:'○', creciente:'◐', menguante:'◑' };

/* ---------- recomendaciones por día ---------- */
const FILTROS = [['todo','Todo'],['meb','MEB'],['papeles','Papeles'],['viajes','Viajes'],['hogar','Hogar'],['cuerpo','Cuerpo'],['rituales','Rituales']];
function recomendaciones(d){
  const lu = lunaDe(d); if (!lu) return null;
  const el = ELEM[lu.signo % 4], s = lu.signo, rx = retroActivos(d).map(r => r.p), dow = d.getDay();
  const R = {};
  // MEB
  let meb = { nueva:['neutro','Planificá y fijá metas para el ciclo. Todavía no lances nada nuevo.'],
    creciente:['bueno','Buen momento para presentar presupuestos, publicar trabajos y salir a buscar clientes.'],
    llena:['bueno','Ideal para cerrar acuerdos, cobrar y mostrar trabajos terminados.'],
    menguante:['neutro','Momento de mantenimiento: ordenar el taller, el stock y cobrar lo pendiente.'] }[lu.fase].slice();
  meb[1] += ' ' + { tierra:'La Luna en tierra favorece los diagnósticos finos, las cotizaciones y el trabajo de precisión.', fuego:'La Luna en fuego favorece mostrarte y vender.', aire:'La Luna en aire favorece negociar, llamar y reunirte.', agua:'La Luna en agua favorece cuidar a los clientes de siempre.' }[el];
  if (dow === 4) meb[1] += ' Jueves de Júpiter: pensá en grande.';
  if (rx.includes('Mercurio')) { if (meb[0] === 'bueno') meb[0] = 'neutro'; meb[1] += ' Con Mercurio retrógrado, revisá dos veces cada presupuesto y cada factura.'; }
  R.meb = meb;
  // papeles
  if (rx.includes('Mercurio')) R.papeles = ['evitar','Mercurio retrógrado: si podés, posponé firmas y trámites importantes. Si no, leé todo dos veces y guardá copias.'];
  else if ([2,5,6,9].includes(s) && lu.fase !== 'menguante') R.papeles = ['bueno','Buen día para trámites, contratos y papeles: la Luna en ' + SIGNOS_N[s] + ' ayuda a la claridad.'];
  else R.papeles = ['neutro','Día común para papeles. Mejor dejar las firmas importantes para un día marcado en verde.'];
  // viajes
  if (rx.includes('Mercurio')) R.viajes = ['evitar','Mercurio retrógrado: confirmá reservas, rutas y documentos. Salí con margen.'];
  else if ([2,8,10].includes(s) || dow === 3) R.viajes = ['bueno','Buen día para viajar o visitar clientes lejos.'];
  else R.viajes = ['neutro','Sin contraindicaciones especiales para viajar.'];
  if (rx.includes('Marte')) R.viajes[1] += ' Marte retrógrado: revisá la camioneta antes de salir.';
  // hogar
  if (lu.fase === 'menguante') R.hogar = ['bueno','Ideal para limpiar, ordenar y deshacerte de lo que no usás.'];
  else if (lu.fase === 'creciente' && [1,3,6].includes(s)) R.hogar = ['bueno','Buen momento para comprar o renovar algo para la casa.'];
  else R.hogar = ['neutro','Día tranquilo para la casa.'];
  // cuerpo
  const pelo = lu.fase === 'creciente' ? 'Si te cortás el pelo, crece más rápido.' : lu.fase === 'menguante' ? 'Si te cortás el pelo, el corte dura más.' : '';
  if (lu.fase === 'llena') R.cuerpo = ['evitar','Según la tradición, la Luna llena no es buen momento para tratamientos estéticos o intervenciones. Sí para cuidarte y descansar.'];
  else if ([4,5].includes(s)) R.cuerpo = ['bueno','La Luna en ' + SIGNOS_N[s] + ' es la preferida de la tradición para el pelo. ' + pelo];
  else if (s === 0 || dow === 2) R.cuerpo = ['bueno','Buen día para entrenar fuerte y descargar energía. ' + pelo];
  else R.cuerpo = ['neutro', (pelo || 'Día neutro para el cuidado personal.') + ' Escuchá al cuerpo: también es una máquina que necesita mantenimiento.'];
  // rituales
  R.rituales = lu.fase === 'nueva' || lu.fase === 'llena' ? ['bueno','Día de lunación: ideal para el ritual de ' + LUN_N[lu.fase] + '.'] : ['neutro','Ritual del día de ' + SEMANA[dow].planeta + ' disponible.'];
  return { lu, R, rx };
}

function cruceCartas(a, b, nomB, saltar = () => false){
  const claves = ['Sol','Luna','Ascendente','Medio Cielo','Venus','Júpiter','Marte'], out = [];

    else if (dif === 6) tipo = ['☍','en signos opuestos: se complementan y se equilibran'];

  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#060A24'); g.addColorStop(.5, '#0E1546'); g.addColorStop(1, '#1D1458'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  [[.2,.12,'rgba(79,123,234,.35)'],[.85,.4,'rgba(139,120,240,.32)'],[.4,.95,'rgba(60,45,160,.45)']].forEach(([a, b, c]) => { const r = x.createRadialGradient(W*a, H*b, 0, W*a, H*b, W*.7); r.addColorStop(0, c); r.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = r; x.fillRect(0, 0, W, H); });
  const r = rng('cielo'); for (let i = 0; i < 420; i++) { x.globalAlpha = .3 + r() * .7; x.fillStyle = r() < .15 ? '#F6DE9C' : '#E3E8FF'; x.beginPath(); x.arc(r() * W, r() * H, r() * 2.2 + .4, 0, 6.283); x.fill(); } x.globalAlpha = 1;
}
function cartaCanvas(x, n, X, Y, w){
  return new Promise(res => { const real = new Image(); real.onload = () => { const h = w * 5 / 3; x.save(); x.beginPath(); x.roundRect ? x.roundRect(X, Y, w, h, 22) : x.rect(X, Y, w, h); x.clip(); const r = Math.max(w / real.width, h / real.height), iw = real.width * r, ih = real.height * r; x.drawImage(real, X + (w - iw) / 2, Y + (h - ih) / 2, iw, ih); x.restore(); x.strokeStyle = '#E2BE6E'; x.lineWidth = 6; x.beginPath(); x.roundRect ? x.roundRect(X, Y, w, h, 22) : x.rect(X, Y, w, h); x.stroke(); res(); }; real.onerror = () => cartaSVGCanvas(x, n, X, Y, w).then(res); real.src = cartaImg(n); });
}
function cartaSVGCanvas(x, n, X, Y, w){
  return new Promise(res => { const img = new Image(); img.onload = () => { x.drawImage(img, X, Y, w, w * 5 / 3); res(); }; img.onerror = res;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(cartaSVG(n).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" ')); });
}
function envolver(x, t, X, Y, maxW, lh){
  const pal = t.split(' '); let l = '', y = Y;
  for (const p of pal) { const prueba = l ? l + ' ' + p : p; if (x.measureText(prueba).width > maxW && l) { x.fillText(l, X, y); l = p; y += lh; } else l = prueba; }
  if (l) x.fillText(l, X, y); return y + lh;
}
function rueditaCanvas(x, cx, cy, R){
  x.save(); x.strokeStyle = '#E2BE6E'; x.lineWidth = 3; x.beginPath();
  for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283; x.moveTo(cx + R * .88 * Math.cos(a), cy + R * .88 * Math.sin(a)); x.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); }
  x.stroke(); x.beginPath(); x.arc(cx, cy, R * .88, 0, 6.283); x.stroke();
  x.fillStyle = '#E2BE6E'; x.beginPath(); x.arc(cx, cy, R * .55, 0, 6.283); x.fill(); x.globalCompositeOperation = 'destination-out'; x.beginPath(); x.arc(cx + R * .22, cy - R * .1, R * .48, 0, 6.283); x.fill(); x.restore();
}

async function compartirCanvas(c, nombre, texto){
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const f = new File([blob], nombre, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], text: texto }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = nombre; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}
document.addEventListener('click', async e => {
